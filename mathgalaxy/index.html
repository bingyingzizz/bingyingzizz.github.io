<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>数学星图 · Math Galaxy</title>
<meta name="description" content="可交互的数学知识星图：定理 / 定义 / 引理 按数学板块聚簇，箭头表示推出，黑线表示等价，蓝线表示定义引用。" />
<style>
/* ==========================================================================
   数学星图 · 界面样式
   只负责「浮动 UI」（搜索框 / 工具条 / 图例 / 详情面板），
   星图本体全部画在 canvas 上。
   ========================================================================== */

:root {
  --bg: #ffffff;
  --ink: #1c1c1e;
  --ink-soft: #5b6068;
  --ink-faint: #9aa0a8;
  --line: rgba(20, 22, 28, 0.10);
  --line-strong: rgba(20, 22, 28, 0.18);
  --glass: rgba(255, 255, 255, 0.86);
  --shadow-sm: 0 1px 2px rgba(16, 20, 30, .06), 0 4px 14px rgba(16, 20, 30, .08);
  --shadow-md: 0 2px 6px rgba(16, 20, 30, .08), 0 18px 46px rgba(16, 20, 30, .14);
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- 画布 ---------- */
#viewport { position: fixed; inset: 0; }
#viewport canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;          /* 自己处理双指缩放 */
}
#layer-cloud { z-index: 0; }
#layer-graph { z-index: 1; cursor: grab; }
#layer-graph.dragging { cursor: grabbing; }
#layer-graph.pointing { cursor: pointer; }

/* ---------- 浮动 UI 通用 ---------- */
.floating {
  position: fixed;
  z-index: 10;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

/* ---------- 搜索 ---------- */
#search-box {
  top: 14px;
  left: 14px;
  width: 340px;
  max-width: calc(100vw - 28px);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  height: 40px;
  transition: box-shadow .18s ease, border-color .18s ease;
}
#search-box.active { box-shadow: var(--shadow-md); border-color: var(--line-strong); }
.search-icon { display: flex; color: var(--ink-faint); flex: none; }
.search-icon svg { fill: currentColor; }
#search-input {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  font: inherit;
  color: var(--ink);
}
#search-input::placeholder { color: var(--ink-faint); }
.search-kbd {
  flex: none;
  font: 11px/1 var(--mono);
  color: var(--ink-faint);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 5px;
}
#search-box.active .search-kbd { opacity: .35; }

#search-results {
  position: absolute;
  top: calc(100% + 7px);
  left: 0;
  right: 0;
  max-height: min(56vh, 460px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 5px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
}
#search-results.hidden { display: none; }

.sr-item {
  display: flex;
  align-items: baseline;
  gap: 7px;
  padding: 7px 8px;
  border-radius: 8px;
  cursor: pointer;
  line-height: 1.35;
}
.sr-item:hover, .sr-item.active { background: rgba(20, 22, 28, .055); }
.sr-dot {
  flex: none;
  width: 8px; height: 8px;
  border-radius: 50%;
  transform: translateY(-1px);
}
.sr-title { font-weight: 600; flex: none; white-space: nowrap; }
.sr-sub {
  flex: 1 1 auto;
  min-width: 0;
  color: var(--ink-faint);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sr-region {
  flex: none;
  margin-left: auto;
  max-width: 90px;
  font-size: 11px;
  color: var(--ink-faint);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 1px 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sr-empty { padding: 12px 10px; color: var(--ink-faint); font-size: 13px; }
.sr-group {
  padding: 8px 10px 3px;
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--ink-faint);
}
mark { background: #ffe9a8; color: inherit; padding: 0 1px; border-radius: 3px; }

/* ---------- 工具条 ---------- */
#toolbar {
  top: 14px;
  right: 14px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 5px;
}
#toolbar button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 13px;
  height: 30px;
  min-width: 30px;
  flex: 0 0 auto;             /* 不要被压扁——放不下就换行 */
  padding: 0 9px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .14s ease, color .14s ease;
  white-space: nowrap;
}
#toolbar button:hover { background: rgba(20, 22, 28, .06); color: var(--ink); }
#toolbar button:active { background: rgba(20, 22, 28, .11); }
#toolbar button.toggle { font-size: 12px; padding: 0 8px; color: var(--ink-faint); }
#toolbar button.toggle.on {
  color: var(--ink);
  background: rgba(20, 22, 28, .07);
  box-shadow: inset 0 0 0 1px var(--line);
}
.tb-sep { width: 1px; height: 18px; background: var(--line-strong); margin: 0 4px; }

/* ---------- 图例（同时是「显示 / 隐藏」开关面板） ---------- */
#legend {
  left: 14px;
  bottom: 14px;
  padding: 10px 12px;
  max-width: 300px;
  max-height: calc(100vh - 28px);   /* 窗口太矮时自己滚，别让顶跑出屏幕 */
  overflow-y: auto;
  overscroll-behavior: contain;
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-soft);
}
#legend .lg-title {
  font-size: 10.5px;
  letter-spacing: .1em;
  color: var(--ink-faint);
  margin: 2px 0 5px;
}
#legend .lg-row { display: flex; flex-wrap: wrap; gap: 4px 10px; }
#legend .lg-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
/* 星团：缩进一层，视觉上从属于上面的星系 */
#legend .lg-kids {
  display: flex; flex-wrap: wrap; gap: 3px 10px;
  flex-basis: 100%;                 /* 总是另起一行，层级才看得出来 */
  margin: 3px 0 4px 15px; padding-left: 9px;
  border-left: 2px solid var(--line);
}
#legend .lg-kids .lg-item { font-size: 11.5px; }
#legend .lg-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
#legend .lg-swatch { width: 15px; height: 9px; border-radius: 3px; flex: none; }
#legend .lg-line { width: 16px; height: 0; border-top-width: 2px; border-top-style: solid; flex: none; }
#legend .lg-group + .lg-group { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
#legend.collapsed .lg-body { display: none; }
#legend .lg-head { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
#legend .lg-head b { font-weight: 600; color: var(--ink); font-size: 12.5px; }
#legend .lg-caret { font-size: 9px; color: var(--ink-faint); transition: transform .18s ease; }
#legend.collapsed .lg-caret { transform: rotate(-90deg); }
#legend .lg-body { margin-top: 7px; }

/* 可点击的开关芯片：实心 = 全显示，半透明 + 橙数字 = 藏了一部分，空心 = 全藏起来 */
#legend .lg-tog {
  padding: 1px 5px;
  border-radius: 7px;
  cursor: pointer;
  transition: background .14s ease, opacity .14s ease;
}
#legend .lg-tog:hover { background: rgba(20, 22, 28, .07); }
#legend .lg-tog.part { opacity: .78; }
#legend .lg-tog.off { opacity: .92; }
#legend .lg-tog.off .lg-name { color: var(--ink-faint) !important; }
#legend .lg-name { color: inherit; }
#legend .lg-strong, #legend .lg-tog b { font-weight: 600; color: var(--ink); }
#legend .lg-name[data-nav] {
  cursor: pointer;
  text-underline-offset: 2.5px;
}
#legend .lg-name[data-nav]:hover { text-decoration: underline; }
#legend .lg-num { color: var(--ink-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
#legend .lg-tog.part .lg-num, #legend .lg-tog.off .lg-num { color: #C2703A; font-weight: 600; }
#legend .lg-reset {
  appearance: none;
  margin-left: auto;
  height: 20px;
  padding: 0 8px;
  border: 1px solid rgba(194, 112, 58, .45);
  border-radius: 7px;
  background: rgba(194, 112, 58, .08);
  color: #A85E2C;
  font: inherit;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
}
#legend .lg-reset:hover { background: rgba(194, 112, 58, .16); }
#legend .lg-hint { margin-top: 7px; font-size: 11px; color: var(--ink-faint); line-height: 1.5; }

/* 分层的层号芯片：已展开的层是实心，其余是空心 */
#legend .lg-layers { gap: 3px 4px; }
#legend .lg-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 19px;
  padding: 0 5px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .55);
  color: var(--ink-faint);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  user-select: none;
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}
#legend .lg-chip:hover { border-color: rgba(20, 22, 28, .3); color: var(--ink); }
#legend .lg-chip.on {
  background: rgba(74, 110, 245, .12);
  border-color: rgba(74, 110, 245, .45);
  color: #35509B;
  font-weight: 600;
}
#legend .lg-chip-all { padding: 0 7px; }
#legend .lg-chip-all.on { background: rgba(20, 22, 28, .08); border-color: var(--line-strong); color: var(--ink); }
/* ---------- 详情面板 ---------- */
#panel {
  position: fixed;            /* 冗余声明：不依赖 .floating 也一定浮起来 */
  top: 66px;
  right: 14px;
  bottom: 14px;
  width: 400px;
  max-width: calc(100vw - 28px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 18px 20px 30px;
  transform-origin: top right;
  animation: panel-in .18s cubic-bezier(.2,.8,.3,1);
}
#panel.hidden { display: none; }
@keyframes panel-in {
  from { opacity: 0; transform: translateY(-6px) scale(.985); }
  to   { opacity: 1; transform: none; }
}
#panel-close {
  position: absolute;
  top: 10px; right: 12px;
  width: 26px; height: 26px;
  border: 0; border-radius: 7px;
  background: transparent;
  color: var(--ink-faint);
  font-size: 18px; line-height: 1;
  cursor: pointer;
}
#panel-close:hover { background: rgba(20, 22, 28, .07); color: var(--ink); }

.pn-kind {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600;
  padding: 3px 9px 3px 7px;
  border-radius: 20px;
  color: #fff;
  margin-bottom: 9px;
}
.pn-kind .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.85); }
.pn-h1 { font-size: 19px; font-weight: 650; line-height: 1.35; margin: 0 34px 4px 0; letter-spacing: -.01em; }
.pn-h2 { font-size: 12px; color: var(--ink-faint); margin: 0 0 3px; font-family: var(--mono); word-break: break-all; }
.pn-regions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.pn-chip {
  font-size: 11.5px;
  padding: 2px 9px;
  border-radius: 20px;
  border: 1px solid var(--line-strong);
  color: var(--ink-soft);
  cursor: pointer;
  user-select: none;
}
.pn-chip:hover { background: rgba(20, 22, 28, .05); }
.pn-chip .lg-swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; transform: translateY(1px); }

.pn-sec { margin-top: 18px; }
.pn-sec > h4 {
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-faint); margin: 0 0 8px; font-weight: 600;
}
.pn-body { font-size: 13.5px; line-height: 1.72; color: #24272e; }
.pn-body p { margin: 0 0 9px; }
.pn-body ul, .pn-body ol { margin: 0 0 9px; padding-left: 1.35em; }
.pn-body li { margin: 3px 0; }
.pn-body strong { font-weight: 650; }
.pn-body em { font-style: italic; color: var(--ink-soft); }
.pn-body h5 { font-size: 13px; margin: 14px 0 6px; font-weight: 650; }
.pn-body blockquote {
  margin: 0 0 9px; padding: 2px 0 2px 11px;
  border-left: 2px solid var(--line-strong); color: var(--ink-soft);
}
.pn-body code {
  font-family: var(--mono); font-size: .88em;
  background: rgba(20, 22, 28, .06);
  padding: 1px 5px; border-radius: 5px;
}
.pn-body pre {
  font-family: var(--mono); font-size: 12px; line-height: 1.6;
  background: rgba(20, 22, 28, .045);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 12px;
  overflow-x: auto;
  margin: 0 0 10px;
}
.pn-body pre code { background: none; padding: 0; font-size: inherit; }

/* 数学：优先用 KaTeX，退化时用等宽公式块 */
/* 公式块：优先用系统里的数学字体，保证 ∀∃∈⊆⟺⪯ 这类符号好看 */
.math-block {
  display: block;
  font-family: "Cambria Math", "Latin Modern Math", "STIX Two Math",
               "Times New Roman", Georgia, "Songti SC", "SimSun", serif;
  font-size: 15px;
  line-height: 1.85;
  letter-spacing: .01em;
  background: rgba(74, 110, 245, .055);
  border: 1px solid rgba(74, 110, 245, .16);
  border-radius: 9px;
  padding: 10px 14px;
  margin: 0 0 10px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.katex-block { margin: 2px 0 12px; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.katex { font-size: 1.02em; }

/* 链接列表（推出 / 被推出 / 等价 / 定义） */
.pn-list { display: flex; flex-direction: column; gap: 2px; }
.pn-link {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 8px;
  border-radius: 8px;
  cursor: pointer;
  line-height: 1.45;
}
.pn-link:hover { background: rgba(20, 22, 28, .055); }
.pn-link .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.pn-link .kw { color: var(--ink-faint); font-size: 12px; flex: none; }
.pn-link .nm { font-weight: 600; }
.pn-link > span:last-child { min-width: 0; flex: 1 1 auto; }
.pn-link .ds {
  color: var(--ink-faint); font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pn-none { color: var(--ink-faint); font-size: 12.5px; font-style: italic; }
.pn-hint {
  font-size: 11.5px; line-height: 1.55;
  color: #7a5cd6;
  background: rgba(138, 106, 214, .09);
  border: 1px solid rgba(138, 106, 214, .22);
  border-radius: 7px;
  padding: 5px 9px;
  margin-bottom: 7px;
}

.pn-arith {
  font-size: 13px; line-height: 1.6;
  padding: 9px 11px; border-radius: 9px;
  background: rgba(20, 22, 28, .04);
  border: 1px solid var(--line);
  margin-bottom: 10px;
}
.pn-arith .arrow { color: var(--ink-faint); margin: 0 7px; }
.pn-step { margin-bottom: 14px; }
.pn-step:last-child { margin-bottom: 0; }
.pn-step-title {
  font-size: 12.5px; font-weight: 650; margin-bottom: 6px;
  display: flex; align-items: center; gap: 7px;
}
.pn-step-title .badge {
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
  padding: 1px 6px; border-radius: 5px;
  background: rgba(20, 22, 28, .07); color: var(--ink-soft);
}
.pn-note {
  font-size: 12.5px; color: var(--ink-soft); line-height: 1.65;
  border-left: 2px solid var(--line-strong);
  padding-left: 10px; margin-top: 12px;
}

/* ---------- 底部提示 ---------- */
#hint {
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  padding: 6px 14px;
  font-size: 12px;
  color: var(--ink-faint);
  border-radius: 20px;
  pointer-events: none;
  transition: opacity .5s ease;
  white-space: nowrap;
}
#hint.fade { opacity: 0; }

/* ---------- 小屏适配 ---------- */
@media (max-width: 820px) {
  #search-box { width: calc(100vw - 28px); }
  #toolbar {
    top: 62px;
    right: 14px;
    left: 14px;
    max-width: none;
    flex-wrap: wrap;              /* 窄屏放不下就换行，别溢出屏幕 */
    justify-content: flex-end;
  }
  #toolbar button { height: 28px; padding: 0 8px; }
  #panel {
    top: auto; left: 0; right: 0; bottom: 0;
    width: auto; max-width: none;
    max-height: 62vh;
    border-radius: 16px 16px 0 0;
    padding-bottom: 22px;
  }
  #legend { display: none; }
  #hint { display: none; }
}

</style>
<!-- KaTeX：数学排版。CSS 与 JS 都放 src/ui/，字体在 src/ui/fonts/（与 CSS 同目录，file:// 也能加载） -->

<!-- 出错兜底：任何脚本报错都直接在页面上显示出来，而不是留一片白屏 -->
<script>
window.__mgFatal = function (err) {
  var msg = (err && (err.stack || err.message)) || String(err || '未知错误');
  if (window.console) console.error('[数学星图]', err);
  var show = function () {
    if (document.getElementById('mg-fatal')) return;
    var box = document.createElement('div');
    box.id = 'mg-fatal';
    box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;max-height:50vh;' +
      'overflow:auto;z-index:99;background:#fff;border:1px solid rgba(200,60,60,.35);' +
      'border-left:3px solid #D0483C;border-radius:10px;padding:14px 16px;' +
      'box-shadow:0 12px 40px rgba(0,0,0,.16);white-space:pre-wrap;' +
      'font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#3a2020';
    box.textContent = '数学星图出错了（多半是某个内容包写错了）：\n\n' + msg;
    document.body.appendChild(box);
  };
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
};
window.addEventListener('error', function (e) {
  // 资源（图片/字体）加载失败不算，只管脚本本身的错误
  if (e.target && e.target !== window && e.target.tagName) return;
  window.__mgFatal(e.error || e.message || '脚本执行出错');
}, true);
</script>
</head>
<body>

<!-- ===== 画布层 ===== -->
<div id="viewport" aria-hidden="true">
  <canvas id="layer-cloud"></canvas>
  <canvas id="layer-graph"></canvas>
</div>

<!-- ===== 左上角：搜索 ===== -->
<div id="search-box" class="floating">
  <span class="search-icon" aria-hidden="true">
    <svg viewBox="0 0 16 16" width="14" height="14"><path d="M7 1a6 6 0 1 0 3.7 10.7l3.3 3.3 1-1-3.3-3.3A6 6 0 0 0 7 1Zm0 1.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg>
  </span>
  <input id="search-input" type="text" placeholder="搜索节点：定理 / 定义 / 关键词…"
         autocomplete="off" autocorrect="off" spellcheck="false" />
  <kbd class="search-kbd">/</kbd>
  <div id="search-results" class="hidden" role="listbox"></div>
</div>

<!-- ===== 右上角：工具条 ===== -->
<div id="toolbar" class="floating">
  <button data-act="zoom-in"  title="放大（+）">＋</button>
  <button data-act="zoom-out" title="缩小（−）">－</button>
  <button data-act="fit"      title="适配全部节点（0）">⤢</button>
  <span class="tb-sep"></span>
  <button data-act="toggle-trunk"    class="toggle" title="主干模式：只留学习主线上的节点（缩小时它们的名字也先出现）">主干</button>
  <button data-act="toggle-defs"    class="toggle on" title="显示 / 隐藏「定义引用」蓝线">定义线</button>
  <button data-act="toggle-labels"  class="toggle on" title="显示 / 隐藏节点名称">名称</button>
  <button data-act="toggle-explore" class="toggle" title="探索模式：把「类比」这类弱边提亮（平时压得很淡）">探索</button>
  <button data-act="toggle-wheel"  class="toggle on" title="滚轮：缩放 ⇄ 平移">滚轮·缩放</button>
</div>

<!-- ===== 左下角：图例（同时是「显示 / 隐藏」的开关面板） ===== -->
<div id="legend" class="floating"></div>

<!-- ===== 右侧：详情面板 ===== -->
<aside id="panel" class="floating hidden" aria-live="polite">
  <button id="panel-close" title="关闭（Esc）">×</button>
  <div id="panel-body"></div>
</aside>

<!-- ===== 底部提示 ===== -->
<div id="hint" class="floating">拖拽平移 · 滚轮 / 双指缩放 · 点击节点聚焦 · 点击连线看推导</div>

<!-- =========================================================================
     底层引擎（与内容无关，一般不需要改）
     加载顺序：config → util → camera → graph → layers → layout → background
               → renderer → interaction → search → panel → visibility → loader → app
     ========================================================================= -->

<script>
/* ==========================================================================
   数学星图 · 全局配置与主题
   --------------------------------------------------------------------------
   想改颜色、大小、手感，只改这个文件。
   想加数学内容，去 src/data/ 。
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});

  /* ---------------------------------------------------------------- 配置 */
  MG.config = {
    seed: 20240607,               // 布局随机种子（固定 → 每次打开星图长得一样）

    /* 力导向布局参数（世界坐标 ≈ 1 单位 ≈ 1 像素 @ 缩放 1） */
    layout: {
      iterations: 700,
      idealDist: 120,             // 节点理想间距 k
      repulsion: 0.12,            // 斥力系数（力 = repulsion · k² / d）
      spring: 0.9,                // 有连线节点之间的弹簧强度
      springMax: 22,              // 弹簧力上限（防止跨半个星图的长边把节点拽飞）
      springLenFactor: 1.15,      // 弹簧自然长度 = idealDist × 该系数
      anchorPull: 0.35,           // 把节点拉回「初始匀布位置」的力（保住板块结构与均匀感）
      borderPull: 0.45,           // 跨板块节点的锚定更硬 → 稳定停留在交界带
      capacityFactor: 1.30,       // 板块可用地盘半径 = √(节点数/π) × idealDist × 该系数
      minGap: 64,                 // 节点最小间距（硬碰撞）
      temp0: 62,                  // 初始温度（同时是每步位移上限）
      temp1: 0.5,                 // 终止温度
      maxStep: 26
    },

    /* 相机 */
    camera: {
      minZoom: 0.10,
      maxZoom: 8,
      zoomStep: 1.22,             // 按钮 / 键盘缩放的倍率
      wheelGain: 0.0016,          // 滚轮灵敏度
      fitPadding: 130,
      maxFitZoom: 1.25,
      /* ⚠️ 这是「别缩成一粒灰」的下限，但它会**夹住「适配全部」**：
         夹住的时候内容就出血，适配全部名不副实。所以它必须 ≤ 内容真正需要的
         缩放。内容以后再涨，先来看这个数 —— 现在 221 个点时实际需要 ≈0.20，
         涨到上千个点会掉到 0.07 上下，那时 minZoom 也要一起降。 */
      fitMinZoom: 0.10,
      animateMs: 420              // 相机平移动画时长
    },

    /* 节点 */
    node: {
      baseRadius: 8.5,
      minRadius: 3.0,
      maxRadius: 26,
      radiusPower: 0.62,          // 半径随缩放增长指数（<1 → 缩小时仍看得见）
      ringWidth: 2.0,
      labelOffset: 13,            // 文字在节点下方多远（世界单位）
      labelSize: 14,              // 字号（缩放 1 时）
      labelMinZoom: 0.22,         // （当前未使用，留着是为了别的分支/实验）
      /* 低于此缩放只画「主干 + degree ≥ 3」的名字，并自动去重叠。
         和上面 lod.nodeNameIn 的 px 阈值对应：60/120=0.50 开始出现、100/120≈0.83 全亮，
         取中间偏后一点当闸门。改 idealDist 或 nodeNameIn 时要一起看。 */
      labelMinZoomAll: 0.66,
      labelPad: 3,
      glow: true,

      /* 半径分层：让「中心天体 / 枢纽」与「边角小点」一眼分得开。
         ------------------------------------------------------------------
         ⚠️ 2026-09-23 实测：改之前 hub 只 ×1.32、degree ≥5 只 ×1.22、
         ≥3 只 ×1.1，**全图极差只有 1.61 倍**。于是「四个标准反例」（degree 1）
         和「单射/满射/双射」（degree 7）之间只差 1.22 倍 —— 肉眼几乎分不出，
         用户直接指出「那四个反例看起来快和单射满射双射一样大了」。
         所以改成**分档**：hub 一档、按度数分五档、叶子单独压小。
         极差从 1.61× 拉到 2.6×（叶子 0.78 ↔ 中心天体 2.05）。 */
      sizeTiers: {
        hub: 2.05,              // 星团的中心天体（clusters.js 里手定的 hub）
        byDegree: [             // [最低度数, 倍率]，从上往下取第一个命中
          [12, 1.60],
          [8, 1.42],
          [5, 1.26],
          [3, 1.10],
          [2, 0.95],
          [0, 0.78]             // 叶子：只有一条边的边角小点
        ]
      },
      sizeClamp: 33             // 放大之后的最终上限（世界单位）；minGap 是 64，不会撞
    },

    /* 连线 */
    edge: {
      hitTolerance: 8,            // 点击连线命中容差（屏幕像素）
      implicationWidth: 1.7,
      equivalenceWidth: 2.1,
      definitionWidth: 1.15,
      defCurvature: 0.17,         // 定义线弯曲程度（避免与直线重叠）
      mergeOffset: 52,            // 多前提箭头汇聚点距离目标多远（世界单位）
      arrowSize: 9.5,             // 箭头长度（屏幕像素，随缩放轻微变化）
      equivalenceGlyph: 0.7       // 大于该缩放时在等价线中点画 ⟺
    },

    /* 星团包络（每个「装置」一圈闭合的边界）
       —— 「这块地是谁的」一眼看得见。只在中小缩放出现，放大了让位给节点本身。 */
    envelope: {
      pad: 44,                    // 边界离最远那个点再外扩多少（世界单位）
      samples: 24,                // 绕一圈取多少个方向
      smooth: 3,                  // 半径序列平滑几遍（消掉尖角）
      fillAlpha: 0.026,           // 里面淡淡填一层，表明「这块归它」
      strokeAlpha: 0.32,
      width: 1.3
    },

    /* 电子云背景 */
    background: {
      texScale: 0.42,             // 世界坐标 → 纹理像素
      blobsPerRegion: 15,         // 每个板块的云朵数
      blobAlpha: 0.075,           // 单朵云的基础不透明度（多朵叠加后会更深）
      centerAlpha: 0.065,         // 板块中心大团雾
      nodeAlpha: 0.050,           // 每个节点周围的小团雾
      spread: 0.72,               // 云朵分布半径 / 板块半径
      blobRadiusMin: 0.30,
      blobRadiusMax: 0.50,
      cloudMargin: 110,           // 板块云半径 = 专属节点最大离心距 + 该余量
      cloudRadiusMin: 200,
      dilate: 1.45                // 纹理画布在内容范围外多留的边距
    },

    /* ------------------------------------------------------------------
       多尺度（LOD）：星系 → 星团 → 恒星
       缩小时只看见星系和「整块对整块」的粗连线；
       放大时节点名、节点级细线才逐层淡入。两条曲线交叉淡入淡出。

       ⚠️⚠️ 阈值有两种写法（2026-09-22 重写，别改回绝对 k）：
         { rel: [a, b] } —— 乘以「适配全部」时的缩放 k₀ 的倍率。
             结构性的东西（星系名 / 装置名 / 团级粗线）用它：
             **内容再涨，1× 全图看到的那一层骨架永远一样。**
         { px:  [a, b] } —— 「屏幕上相邻两点相距多少像素」。
             节点级的东西（点 / 细线 / 名字）用它：布局里相连节点的世界距离
             是固定的 layout.idealDist，所以换算成 k = px / idealDist 是
             **与内容多少无关**的绝对量。

       为什么必须这么写：旧写法全是绝对 k，是按「content 铺满 ≈ k 0.62」标定的
       （那是内容只有几十个点的时候）。内容长到 3118×2721 之后「适配全部」
       只剩 k≈0.20，所有曲线都还没起步 —— 全图就只剩云和圆点，一条推导线都不画，
       装置名也不出。**内容会长大，绝对值就会过期。**（铁律 4 的坑）

       各区间重叠 → 交叉淡入淡出，不会突然跳变。
       ------------------------------------------------------------------ */
    lod: {
      /* —— 结构性：倍率 × k₀ —— */
      galaxyNameIn:   { rel: [0.25, 0.85] },  // 星系名：全图就亮
      galaxyNameHold: 0.50,                   // 装置名出来时，星系名最多压掉多少
      clusterNameIn:  { rel: [0.45, 1.15] },  // 装置名：全图就基本全亮，放大后让位给节点名
      clusterNameOut: { rel: [2.00, 3.60] },
      clusterLinkOut: { rel: [1.00, 2.80] },  // 团级粗线：全图最亮，放大后退场
      trunkNameIn:    { rel: [0.85, 1.05] },  // 主干名：全图就全亮（去重叠会筛掉挤的）

      /* —— 节点级：屏幕上相邻两点的像素距离 —— */
      nodeDotIn:  { px: [8, 20] },            // 圆点：几乎一直在
      nodeEdgeIn: { px: [36, 66] },           // 节点级细线
      nodeNameIn: { px: [60, 100] },          // 节点名：相邻够 60px 才出现

      /* 主干内部的边：全图尺度上单独留一条「骨架」。
         节点级连线要等相邻 36px 才画，那时已经放大 1.3 倍以上了 ——
         这段区间里主线也看不见。给它一条自己的曲线，缩小时才看得见主线。 */
      trunkEdgeIn: { rel: [0.50, 1.25] },
      /* 全图时把「不在主干上」的点/名压暗，主线才浮得出来；放大到 2.2× k₀ 恢复原样。
         （主干本来是 58 个点、84 条内部边的**一张网**，不压暗的话只是多一层网。） */
      trunkDimIn:  { rel: [0.60, 2.20] },
      trunkDimMax: 0.60,         // 全图时非主干点保留多少不透明度（0.40 = 压掉 60%）

      /* 星团包络：和装置名同一档出现，放大到节点名出来之前就退场 */
      envelopeIn:  { rel: [0.25, 0.85] },
      envelopeOut: { rel: [1.40, 2.80] }
    },

    /* 星团（一套自足的装置，内部关系密、对外整块连接） */
    cluster: {
      gap: 1.62,            // 星团之间的间距系数（越大越松）
      minRadius: 92,        // 星团最小可用半径
      nodeSpread: 0.80,     // 节点在星团圆盘里铺开的比例
      cloudPadding: 76,     // 星团云比节点分布外扩多少（世界单位）
      cloudMinRadius: 130,
      cloudAlpha: 0.085,    // 星团云不透明度（叠在星系云上，形成"更密的结"）
      labelSize: 13.5,
      labelOffset: 0,       // 星团名放在星团中心上方
      namePad: 6            // 星团名底下那块底色的内边距
    },

    /* 星团级连线（自动从节点级连线聚合出来，不需要手写） */
    clusterLink: {
      minEdges: 2,          // 两个星团之间至少这么多条节点连线才画
      widthMin: 1.6,
      widthMax: 7.5,
      color: '86, 104, 140',
      alpha: 0.30,
      curve: 0.10           // 弯曲程度，避免和节点级连线重叠
    },

    /* 聚焦模式：点击节点后，只保留它和它的邻居 */
    focus: {
      hideUnrelated: false,       // true → 无关节点/连线彻底不画；false → 压得很淡（保留方位感）
      dimNodeAlpha: 0.09,
      dimEdgeAlpha: 0.05,
      dimLabelAlpha: 0.10
    },

    /* 弱边（类比）的显示 */
    analogy: {
      dimAlpha: 0.10,       // 关掉探索模式时弱边压到多淡
      exploreAlpha: 0.55,
      dash: [5, 5]
    },

    /* 开关默认值 */
    exploreMode: false,     // true → 打开弱边（探索模式）
    showDefinitionLines: true,
    showLabels: true,
    wheelZooms: true,             // false → 滚轮平移（触控板手感）
    hideParallelImplications: true, // 已有等价线时不再叠画同对节点的箭头
    highlightDefinitions: true    // 面板上把「定义引用」单独分组
  };

  /* ---------------------------------------------------------------- 主题 */
  MG.theme = {
    /* 图例里节点类型的显示顺序（也是「重要程度」的排序依据） */
    typeOrder: ['axiom', 'definition', 'theorem', 'lemma', 'proposition', 'corollary', 'example'],

    /* 节点类型 → 颜色。改这里即可换配色。 */
    nodeTypes: {
      axiom:       { name: '公理',  color: '#7A5CD6', short: '公理' },
      definition:  { name: '定义',  color: '#8B93A7', short: '定义' },
      theorem:     { name: '定理',  color: '#2F9E63', short: '定理' },
      lemma:       { name: '引理',  color: '#E08434', short: '引理' },
      proposition: { name: '命题',  color: '#12A0B8', short: '命题' },
      corollary:   { name: '推论',  color: '#3A7BD5', short: '推论' },

      refs: toArray(n.refs),
      pack: packName,
      /* 布局结果 */
      x: 0, y: 0,
      pinned: n.pinned || null
    };
    return node;
  }

  function normEdge(e, packName) {
    if (!e || !e.kind) throw new Error('[' + packName + '] 边缺少 kind：' + JSON.stringify(e));
    var edge = {
      id: e.id || null,
      kind: e.kind,
      title: e.title || '',
      proof: e.proof || '',
      proofs: e.proofs || null,
      note: e.note || '',
      pack: packName,
      label: e.label || '',
      /* 强弱：可以在数据里显式覆盖，否则按 kind 查表（见 config 的 edgeStrength） */
      strength: e.strength || null
    };
    if (e.kind === 'analogy') {
      edge.a = e.a || e.from; edge.b = e.b || e.to;
    } else if (e.kind === 'equivalence') {
      edge.a = e.a; edge.b = e.b;
    } else if (e.kind === 'definition') {
      edge.definition = e.definition || e.a;
      edge.usedBy = e.usedBy || e.b;
    } else { // implication（默认）
      edge.kind = 'implication';
      edge.sources = toArray(e.sources || e.from);
      edge.target = e.target || e.to;
    }
    return edge;
  }

  function toArray(v) {
    if (v == null) return [];
    return Array.isArray(v) ? v.slice() : [v];
  }

  /** 主干名单里写了不存在的 id → 提示（改内容时最容易忘的地方） */
  function graph_trunkWarn(trunkIds, byId, warnings) {
    trunkIds.forEach(function (id) {
      if (!byId[id]) warnings.push('主干名单里的节点不存在：' + id);
    });
  }

  /** 一条边涉及的所有节点 id */
  function edgeNodes(e) {
    if (e.kind === 'equivalence' || e.kind === 'analogy') return [e.a, e.b];
    if (e.kind === 'definition') return [e.definition, e.usedBy];
    return e.sources.concat([e.target]);
  }

  /** 一条边的「主目标」（用于箭头方向 / 排序） */
  function edgeTarget(e) {
    if (e.kind === 'equivalence' || e.kind === 'analogy') return e.b;
    if (e.kind === 'definition') return e.usedBy;
    return e.target;
  }

  /**
   * 强边 / 弱边。
   * strong = 标准逻辑关系（推出、等价、定义依赖）—— 查证明走这些
   * weak   = 类比 / 思想相通 —— 只在探索模式里出现
   */
  function strengthOf(e) {
    if (e.strength) return e.strength;
    var tbl = (MG.theme && MG.theme.edgeStrength) || {};
    return tbl[e.kind] || 'strong';
  }

  function isWeak(e) { return strengthOf(e) === 'weak'; }

  /* ------------------------------------------------------------------ 构建 */
  function buildGraph(packs, regions, clusterDefs) {
    var nodes = [], edges = [], byId = Object.create(null);
    var warnings = [];

    packs.forEach(function (pack) {
      var name = pack.name || 'pack';
      (pack.nodes || []).forEach(function (raw) {
        var n = normNode(raw, name);
        if (byId[n.id]) { warnings.push('重复的节点 id，后者被忽略：' + n.id); return; }
        byId[n.id] = n;
        nodes.push(n);
      });
    });

    var autoId = 0;
    packs.forEach(function (pack) {
      var name = pack.name || 'pack';
      (pack.edges || []).forEach(function (raw) {
        if (raw && raw.kind === 'cluster-link') return;  // 星团连线请写在 pack.clusterLinks
        var e = normEdge(raw, name);
        e.id = e.id || ('e' + (++autoId) + ':' + e.kind);
        edges.push(e);
      });
    });

    /* 校验 + 去重 */
    var kept = [];
    edges.forEach(function (e) {
      var ids = edgeNodes(e);
      var ok = true;
      ids.forEach(function (id) {
        if (!byId[id]) { ok = false; warnings.push('边 ' + e.id + ' 指向不存在的节点：' + id); }
      });
      if (!ok) return;
      kept.push(e);
    });
    edges = kept;

    var adj = Object.create(null);
    var edgesOf = Object.create(null);
    nodes.forEach(function (n) { adj[n.id] = Object.create(null); edgesOf[n.id] = []; });

    /* ---------------------------------------------------------- 主干 */
    /* 内容里用 MG.trunk 列出一批 id（学习主线）。这里只打一个标记，
       剩下的交给引擎：工具条的「主干」按钮会把非主干藏起来。 */
    var trunkIds = (MG.trunk || []);
    nodes.forEach(function (n) { n.trunk = trunkIds.indexOf(n.id) >= 0; });
    graph_trunkWarn(trunkIds, byId, warnings);

    edges.forEach(function (e) {
      edgeNodes(e).forEach(function (id) {
        edgesOf[id].push(e);
        edgeNodes(e).forEach(function (other) {
          if (other !== id) adj[id][other] = true;
        });
      });
    });

    /* 相邻表转数组 */
    var adjList = Object.create(null);
    Object.keys(adj).forEach(function (id) { adjList[id] = Object.keys(adj[id]); });

    var graph = {
      nodes: nodes,
      edges: edges,
      byId: byId,
      regions: regions || [],
      regionById: Object.create(null),
      adj: adjList,
      edgesOf: edgesOf,
      warnings: warnings,
      edgeNodes: edgeNodes,
      edgeTarget: edgeTarget
    };

    graph.regions.forEach(function (r) { graph.regionById[r.id] = r; });

    /* ---------------------------------------------------------- 星团索引 */
    /* 星团 = 星系内部一套「自足的装置」。节点写 cluster 字段即归属；
       不写就直属于星系。星团的 parent 指向它所属的星系。            */
    var clusters = (clusterDefs || []).slice();
    var clusterById = Object.create(null);
    clusters.forEach(function (c) {
      clusterById[c.id] = c;
      c.nodes = [];
      c.region = null;
    });
    nodes.forEach(function (n) {
      var co = n.cluster ? clusterById[n.cluster] : null;
      if (n.cluster && !co) {
        warnings.push('节点 ' + n.id + ' 指向不存在的星团：' + n.cluster);
      }
      n.clusterObj = co || null;
      if (co) co.nodes.push(n);
    });
    graph.clusters = clusters;
    graph.clusterById = clusterById;

    /* 星团的「中心天体」（clusters.js 里的 hub 字段）。
       它是这个装置要造出来的那个东西 —— 画亮核 / 定中心 / 分尺度展开都靠它。
       写错 id 或者写到别的团里，都在这里提示（跟主干名单一样容易忘）。 */
    clusters.forEach(function (c) {
      c.hubObj = null;
      if (!c.hub) return;
      var h = byId[c.hub];
      if (!h) { warnings.push('星团 ' + c.id + ' 的 hub 指向不存在的节点：' + c.hub); return; }
      if (h.cluster !== c.id) {
        warnings.push('星团 ' + c.id + ' 的 hub 不属于本团：' + c.hub + '（实际在 ' + h.cluster + '）');
        return;
      }
      c.hubObj = h;
      h.isHub = true;
    });

    /** 星团所属星系对象 */
    graph.galaxyOf = function (c) {
      return (c && c.parent && graph.regionById[c.parent]) || null;
    };

    /**
     * 星团之间的连线。
     *  · 自动聚合：两个星团之间有几条节点级连线，就累积几条
     *  · 显式声明：数据里写 { kind:'cluster-link', a:'团id', b:'团id', label }
     * 两种合并，显式的权重更高。
     *
     * edgeOk 可选：只统计「还在场」的连线（用户藏了节点时用）。
     */
    graph.buildClusterLinks = function (edgeOk) {
      var tally = Object.create(null);

      function bump(a, b, w, extra) {
        if (!a || !b || a === b) return;
        var key = a < b ? a + '|' + b : b + '|' + a;
        if (!tally[key]) tally[key] = { a: a < b ? a : b, b: a < b ? b : a, count: 0, links: [] };
        tally[key].count += w;
        if (extra) tally[key].links.push(extra);
      }

      edges.forEach(function (e) {
        if (edgeOk && !edgeOk(e)) return;
        var cs = [];
        edgeNodes(e).forEach(function (id) {
          var n = byId[id];
          if (n && n.clusterObj && cs.indexOf(n.clusterObj.id) < 0) cs.push(n.clusterObj.id);
        });
        for (var i = 0; i < cs.length; i++) {
          for (var j = i + 1; j < cs.length; j++) {
            // 每对星团之间计入一次（一条边只算一次）
            bump(cs[i], cs[j], 1, { kind: e.kind, id: e.id });
          }
        }
      });

      // 显式星团连线
      packs.forEach(function (pack) {
        (pack.clusterLinks || []).forEach(function (l, k) {
          var a = l.a || l.from, b = l.b || l.to;
          if (!clusterById[a] || !clusterById[b]) {
            warnings.push('星团连线指向不存在的星团：' + a + ' / ' + b);
            return;
          }
          var key = a < b ? a + '|' + b : b + '|' + a;
          if (!tally[key]) tally[key] = { a: a < b ? a : b, b: a < b ? b : a, count: 0, links: [] };
          tally[key].count += l.weight || 4;
          tally[key].explicit = true;
          tally[key].label = l.label || tally[key].label;
          tally[key].note = l.note || tally[key].note;
        });
      });

      return Object.keys(tally).map(function (k) { return tally[k]; });
    };

    graph.clusterLinks = graph.buildClusterLinks();

    /* 每个节点真正「用到的定义」（蓝线另一头是定义节点） */
    graph.definitionsOf = function (id) {
      return edgesOf[id].filter(function (e) { return e.kind === 'definition'; })
        .map(function (e) { return e.definition === id ? e.usedBy : e.definition; });
    };
    graph.usersOf = function (id) {
      return edgesOf[id].filter(function (e) { return e.kind === 'definition'; })
        .map(function (e) { return e.definition === id ? e.usedBy : e.definition; });
    };

    graph.bbox = function () {
      if (!nodes.length) return { minX: -1, minY: -1, maxX: 1, maxY: 1 };
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      nodes.forEach(function (n) {
        if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
        if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
      });
      return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
    };

    return graph;
  }

  /**
   * 实际参与绘制的边。
   * —— 若 A、B 之间已有「等价」黑线，默认不再叠画 A↔B 的箭头（视觉太挤），
   *    被隐藏箭头上的推导过程会自动合并进等价线的详情里。
   */
  function visibleEdges(graph) {
    var defsOn = MG.config.showDefinitionLines;
    var hideParallel = MG.config.hideParallelImplications;

    var eqPairs = Object.create(null);
    if (hideParallel) {
      graph.edges.forEach(function (e) {
        if (e.kind !== 'equivalence') return;
        eqPairs[e.a + '|' + e.b] = true;
        eqPairs[e.b + '|' + e.a] = true;
      });
    }

    return graph.edges.filter(function (e) {
      if (e.kind === 'definition' && !defsOn) return false;
      if (e.kind === 'implication' && hideParallel) {
        var a = e.sources[0], b = e.target;
        if (e.sources.length === 1 && eqPairs[a + '|' + b]) return false;
        if (eqPairs[b + '|' + a]) return false;
      }
      return true;
    });
  }

  /** 与某个节点相连、且当前可见的边 */
  function visibleEdgesOf(graph, id, visible) {
    var set = visible || visibleEdges(graph);
    return set.filter(function (e) { return edgeNodes(e).indexOf(id) >= 0; });
  }

  MG.buildGraph = buildGraph;
  MG.graphUtil = {
    edgeNodes: edgeNodes,
    edgeTarget: edgeTarget,
    strengthOf: strengthOf,
    isWeak: isWeak,
    visibleEdges: visibleEdges,
    visibleEdgesOf: visibleEdgesOf,
    toArray: toArray
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 分层（依赖深度）
   --------------------------------------------------------------------------
   依赖方向是「前置 → 依赖它的」：

     推出   implication: sources → target
     定义   definition : definition → usedBy
     等价   equivalence: 双向（互为等价的点必然同层）

   ⚠️ 等价关系会造成环（{选择公理, 良序定理, 佐恩引理, Hausdorff, Tukey}
      是一整个环；{紧, 全有界, 列紧, 完备} 也是），所以**不能直接当 DAG 算层号**。
      做法：Tarjan 缩点 → 在缩点图上算最长路径 → 每个点取它所在分量的层号，
      等价的那几个自然落在同一层。

   弱边（类比）不参与分层 —— 它不是逻辑依赖。

   层号**不写进内容**：连线一改，层号就该跟着变，所以每次打开现算。
   算完写在节点上（n.layer）和图对象上（graph.maxLayer / graph.layerSizes），
   图例的分层开关与详情面板直接用它们。
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});

  function computeLayers(graph) {
    var nodes = graph.nodes;
    var n = nodes.length;
    var index = Object.create(null);
    nodes.forEach(function (nd, i) { index[nd.id] = i; });

    /* ------------------------------------------- 1. 邻接表（前置 → 后） */
    var out = [];
    for (var i = 0; i < n; i++) out.push([]);
    function link(a, b) {
      var ia = index[a], ib = index[b];
      if (ia == null || ib == null || ia === ib) return;
      out[ia].push(ib);
    }
    graph.edges.forEach(function (e) {
      if (e.kind === 'implication') {
        (e.sources || []).forEach(function (s) { link(s, e.target); });
      } else if (e.kind === 'definition') {
        link(e.definition, e.usedBy);
      } else if (e.kind === 'equivalence') {
        link(e.a, e.b); link(e.b, e.a);
      }
      /* analogy（弱边）不算 */
    });

    /* ------------------------------------------- 2. Tarjan 缩点（迭代版） */
    var idx = new Int32Array(n).fill(-1);
    var low = new Int32Array(n);
    var onStk = new Uint8Array(n);
    var stk = [], compOf = new Int32Array(n).fill(-1), compCount = 0;
    var counter = 0;

    for (var root = 0; root < n; root++) {
      if (idx[root] !== -1) continue;
      var work = [[root, 0]];
      while (work.length) {
        var frame = work[work.length - 1];
        var v = frame[0], pi = frame[1];
        if (pi === 0) { idx[v] = low[v] = counter++; stk.push(v); onStk[v] = 1; }
        var ns = out[v];
        var advanced = false;
        for (var k = pi; k < ns.length; k++) {
          var w = ns[k];
          if (idx[w] === -1) { frame[1] = k + 1; work.push([w, 0]); advanced = true; break; }
          if (onStk[w] && idx[w] < low[v]) low[v] = idx[w];
        }
        if (advanced) continue;
        frame[1] = ns.length;
        if (low[v] === idx[v]) {
          for (;;) {
            var u = stk.pop();
            onStk[u] = 0;
            compOf[u] = compCount;
            if (u === v) break;
          }
          compCount++;
        }
        work.pop();
        if (work.length) {
          var p = work[work.length - 1][0];
          if (low[v] < low[p]) low[p] = low[v];
        }
      }
    }

    /* ------------------------------------------- 3. 缩点图 + 最长路径 */
    var cadj = [];
    for (i = 0; i < compCount; i++) cadj.push([]);
    var cin = [];
    for (i = 0; i < compCount; i++) cin.push([]);
    var seenEdge = Object.create(null);
    for (i = 0; i < n; i++) {
      var ca = compOf[i];
      for (var j = 0; j < out[i].length; j++) {
        var cb = compOf[out[i][j]];
        if (ca === cb) continue;
        var key = ca + '>' + cb;
        if (seenEdge[key]) continue;
        seenEdge[key] = 1;
        cadj[ca].push(cb);
        cin[cb].push(ca);
      }
    }

    /* 缩点后一定是 DAG → 按拓扑序（用入度做 Kahn）算最长路径 */
    var clevel = new Int32Array(compCount);
    var indeg = new Int32Array(compCount);
    for (i = 0; i < compCount; i++) indeg[i] = cin[i].length;
    var queue = [];
    for (i = 0; i < compCount; i++) if (indeg[i] === 0) queue.push(i);
    var qi = 0;
    while (qi < queue.length) {
      var c = queue[qi++];
      for (j = 0; j < cadj[c].length; j++) {
        var nx = cadj[c][j];
        if (clevel[c] + 1 > clevel[nx]) clevel[nx] = clevel[c] + 1;
        if (--indeg[nx] === 0) queue.push(nx);
      }
    }

    /* ------------------------------------------- 4. 写回 */
    var maxLayer = 0;
    var sizes = [];
    nodes.forEach(function (nd, ii) {
      var lv = clevel[compOf[ii]];
      nd.layer = lv;
      if (lv > maxLayer) maxLayer = lv;
      while (sizes.length <= lv) sizes.push([]);
      sizes[lv].push(nd);
    });

    graph.maxLayer = maxLayer;
    graph.layerSizes = sizes;
    graph.layerOf = function (id) {
      var ix = index[id];
      return ix == null ? null : clevel[compOf[ix]];
    };
    /* 缩点后所属的强连通分量编号。用途：判断一条边的两端是不是「同一个等价类」
       —— 同一个分量里的边不该拉开层号（等价链就是这种情况）。
       构建脚本的「层号与边方向不矛盾」校验要靠它。 */
    graph.componentOf = function (id) {
      var ix = index[id];
      return ix == null ? null : compOf[ix];
    };
    return { maxLayer: maxLayer, sizes: sizes, components: compCount };
  }

  MG.computeLayers = computeLayers;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 布局求解（三层：星系 → 星团 → 恒星）
   --------------------------------------------------------------------------
   1) 星系：regions.js 里声明的中心 + 半径
   2) 星团：把一套「自足的装置」的节点聚成一团圆盘，多个星团在星系内按环状排布
   3) 恒星：节点在所属星团的圆盘里用向日葵螺旋匀布

   跨板块（多 region）的节点会被推向「朝着另一个星系」的那一侧边缘，
   于是仍然满足「内容交叉的节点落在边界上」。

   全程使用固定随机种子 → 每次打开星图长得一模一样。
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;

  var GOLDEN = Math.PI * (3 - Math.sqrt(5)); // ≈ 2.39996，向日葵螺旋的转角

  /** 一个圆盘里放 count 个点，需要多大半径 */
  function discRadius(count, factor) {
    var ideal = MG.config.layout.idealDist;
    return Math.sqrt(Math.max(count, 1) / Math.PI) * ideal * (factor || 1);
  }

  /** 节点的归属点（跨板块 → 按半径加权的交界点）；没有星团时才用得上 */
  function regionTarget(node, graph) {
    var rs = [];
    node.regions.forEach(function (id) { if (graph.regionById[id]) rs.push(graph.regionById[id]); });
    if (!rs.length) return { x: 0, y: 0 };
    if (rs.length === 1) return { x: rs[0].center.x, y: rs[0].center.y };
    var wsum = 0, x = 0, y = 0;
    rs.forEach(function (r) { wsum += r.radius; x += r.center.x * r.radius; y += r.center.y * r.radius; });
    return { x: x / wsum, y: y / wsum };
  }

  /* ==================================================================== */
  function computeLayout(graph) {
    var cfg = MG.config.layout;
    var ccfg = MG.config.cluster;
    var nodes = graph.nodes;
    if (!nodes.length) return;

    /* -------------------------------------------------------- 0. 准备 */
    nodes.forEach(function (n) {
      n.target = regionTarget(n, graph);
      n.regionObjs = n.regions.map(function (id) { return graph.regionById[id]; }).filter(Boolean);
      n.isBorder = n.regionObjs.length > 1;
      n.degree = (graph.adj[n.id] || []).length;
      n.galaxy = n.clusterObj ? graph.galaxyOf(n.clusterObj) : (n.regionObjs[0] || null);
    });

    graph.regions.forEach(function (r) {
      r._cap = Math.max(discRadius(nodes.filter(function (n) { return n.regions.indexOf(r.id) >= 0; }).length,
        cfg.capacityFactor), 140);
    });

    /* -------------------------------------------- 1. 星团在星系内排布 */
    var liveClusters = [];
    graph.clusters.forEach(function (c) {
      c.nodes = c.nodes.filter(function (n) { return nodes.indexOf(n) >= 0; });
      if (!c.nodes.length) { c.center = null; c._cap = 0; return; }
      c._cap = Math.max(discRadius(c.nodes.length, 1.26), ccfg.minRadius);
      var g = graph.galaxyOf(c);
      c.center = g ? { x: g.center.x, y: g.center.y } : { x: 0, y: 0 };
      liveClusters.push(c);
    });

    graph.regions.forEach(function (reg) {
      var mine = liveClusters.filter(function (c) { return c.parent === reg.id; });
      if (!mine.length) return;
      // 大的排前面，视觉上更像"星系核 + 外环"
      mine.sort(function (a, b) { return b.nodes.length - a.nodes.length; });
      var maxCap = 0;
      mine.forEach(function (c) { maxCap = Math.max(maxCap, c._cap); });

      if (mine.length === 1) {
        mine[0].center = { x: reg.center.x, y: reg.center.y };
        return;
      }
      var ringR = Math.max(maxCap * 1.05, reg._cap * (0.34 + 0.05 * Math.min(mine.length, 6)));
      var phase = (U.hashString(reg.id) % 628) / 100;
      mine.forEach(function (c, i) {
        var th = phase + i * (Math.PI * 2 / mine.length);
        // 团越大，稍微往外挪一点，避免挤在一起
        var rr = ringR + c._cap * 0.18;
        c.center = { x: reg.center.x + Math.cos(th) * rr, y: reg.center.y + Math.sin(th) * rr };
      });
      // 星系圆盘要装得下所有星团
      reg._cap = Math.max(reg._cap, ringR + maxCap * 1.15 + 60);
    });

    /* ------------------------------------------------ 2. 节点锚点 */
    var buckets = Object.create(null);   // 无星团节点按星系分桶
    var borders = [], orphans = [];

    // 2a. 有星团的节点：在星团圆盘内螺旋 → 再按「另一个星系」的方向往外推
    liveClusters.forEach(function (c) {
      var list = c.nodes.slice().sort(function (a, b) {
        if (b.degree !== a.degree) return b.degree - a.degree;
        return a.id < b.id ? -1 : 1;
      });
      var n = list.length;
      var R = Math.max(c._cap * ccfg.nodeSpread, 46);
      var phase = (U.hashString(c.id) % 628) / 100;
      list.forEach(function (node, i) {
        var rr = R * Math.sqrt((i + 0.42) / n);
        var th = i * GOLDEN + phase;
        var x = c.center.x + Math.cos(th) * rr;
        var y = c.center.y + Math.sin(th) * rr;

        // 跨板块：朝「另一个星系」那一侧挪，落在交界带
        if (node.isBorder) {
          var others = node.regionObjs.filter(function (r) { return r.id !== c.parent; });
          if (others.length) {
            var t = others[0].center;
            var dx = t.x - c.center.x, dy = t.y - c.center.y;
            var L = Math.sqrt(dx * dx + dy * dy) || 1;
            var push = c._cap * 0.62;
            x += (dx / L) * push;
            y += (dy / L) * push;
          }
        }
        node.anchor = { x: x, y: y };
      });
    });

    // 2b. 没有星团的节点：还在星系圆盘里铺（老逻辑）
    nodes.forEach(function (n) {
      if (n.clusterObj) return;
      if (!n.regionObjs.length) { orphans.push(n); return; }
      if (n.isBorder) { borders.push(n); return; }
      var rid = n.regionObjs[0].id;
      (buckets[rid] = buckets[rid] || []).push(n);
    });

    Object.keys(buckets).forEach(function (rid) {
      var region = graph.regionById[rid];
      var list = buckets[rid].slice().sort(function (a, b) {
        if (b.degree !== a.degree) return b.degree - a.degree;
        return a.id < b.id ? -1 : 1;
      });
      var n = list.length;
      var R = Math.max(region._cap * 0.8, 60);
      var phase = (U.hashString(rid) % 628) / 100;
      list.forEach(function (node, i) {
        var rr = R * Math.sqrt((i + 0.42) / n);
        var th = i * GOLDEN + phase;
        node.anchor = { x: region.center.x + rr * Math.cos(th), y: region.center.y + rr * Math.sin(th) };
      });
    });

    // 2c. 跨星系又没星团：沿「星系连线的法向」错开（老逻辑）
    borders.sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    borders.forEach(function (node, i) {
      var ordered = node.regionObjs.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; });
      var first = ordered[0], last = ordered[ordered.length - 1];
      var dx = last.center.x - first.center.x, dy = last.center.y - first.center.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len, ny = dx / len;
      var side = (i % 2 === 0) ? 1 : -1;
      var rank = Math.floor(i / 2) + 1;
      var off = side * (44 + rank * 52);
      var along = ((i % 3) - 1) * 40;
      node.anchor = {
        x: node.target.x + nx * off + (dx / len) * along,
        y: node.target.y + ny * off + (dy / len) * along
      };
    });

    orphans.sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    orphans.forEach(function (node, i) {
      node.anchor = { x: -180 + (i % 5) * 120, y: 820 + Math.floor(i / 5) * 120 };
    });

    nodes.forEach(function (n) { if (n.anchor) { n.x = n.anchor.x; n.y = n.anchor.y; } });

    /* ---------------------------------------------------- 3. 松弛 */
    var k = cfg.idealDist;
    var cutoff = k * 2.4, cutoff2 = cutoff * cutoff;
    var springLen = k * cfg.springLenFactor;

    var pairs = [];
    graph.edges.forEach(function (e) {
      var ids = MG.graphUtil.edgeNodes(e);
      var w = e.kind === 'implication' ? 1 : (e.kind === 'equivalence' ? 1.15 : 0.35);
      for (var a = 0; a < ids.length; a++) {
        for (var b = a + 1; b < ids.length; b++) {
          var ia = indexOf(nodes, ids[a]), ib = indexOf(nodes, ids[b]);
          if (ia < 0 || ib < 0) continue;
          pairs.push([ia, ib, w]);
        }
      }
    });

    var N = nodes.length;
    var disp = new Float64Array(N * 2);
    var i, j, dx, dy, d, d2, f, ux, uy, step, n;

    for (var iter = 0; iter < cfg.iterations; iter++) {
      var t = iter / Math.max(1, cfg.iterations - 1);
      var temp = U.lerp(cfg.temp0, cfg.temp1, t * t);
      for (i = 0; i < N * 2; i++) disp[i] = 0;

      /* 3a. 排斥 */
      for (i = 0; i < N; i++) {
        var ni = nodes[i];
        for (j = i + 1; j < N; j++) {
          var nj = nodes[j];
          dx = ni.x - nj.x; dy = ni.y - nj.y;
          d2 = dx * dx + dy * dy;
          if (d2 < 1e-6) { dx = 0.7 + (i - j) * 0.13; dy = 0.4; d2 = dx * dx + dy * dy; }
          if (d2 > cutoff2) continue;
          d = Math.sqrt(d2);
          f = (k * k / d) * cfg.repulsion;
          ux = dx / d; uy = dy / d;
          disp[i * 2] += ux * f; disp[i * 2 + 1] += uy * f;
          disp[j * 2] -= ux * f; disp[j * 2 + 1] -= uy * f;
        }
      }

      /* 3b. 弹簧 */
      for (var s = 0; s < pairs.length; s++) {
        i = pairs[s][0]; j = pairs[s][1];
        dx = nodes[i].x - nodes[j].x; dy = nodes[i].y - nodes[j].y;
        d = Math.sqrt(dx * dx + dy * dy) || 1;
        f = ((d - springLen) / d) * cfg.spring * pairs[s][2] * k * 0.55;
        if (f > cfg.springMax) f = cfg.springMax;
        else if (f < -cfg.springMax) f = -cfg.springMax;
        disp[i * 2] -= (dx / d) * f; disp[i * 2 + 1] -= (dy / d) * f;
        disp[j * 2] += (dx / d) * f; disp[j * 2 + 1] += (dy / d) * f;
      }

      /* 3c. 锚点拉力 + 星团软边界 */
      for (i = 0; i < N; i++) {
        n = nodes[i];
        if (n.pinned || !n.anchor) continue;
        f = n.isBorder ? cfg.borderPull : cfg.anchorPull;
        disp[i * 2] += (n.anchor.x - n.x) * f;
        disp[i * 2 + 1] += (n.anchor.y - n.y) * f;

        // 星团软墙：别飘出自己的星团
        if (n.clusterObj && n.clusterObj.center) {
          var cx = n.clusterObj.center.x, cy = n.clusterObj.center.y;
          var vx = n.x - cx, vy = n.y - cy;
          var vd = Math.sqrt(vx * vx + vy * vy) || 1;
          var lim = n.clusterObj._cap * 1.28 + 30;
          if (vd > lim) {
            var pull = (vd - lim) * 0.10;
            disp[i * 2] -= (vx / vd) * pull;
            disp[i * 2 + 1] -= (vy / vd) * pull;
          }
        }
      }

      /* 3d. 应用位移 */
      var cap = Math.max(temp, 0.05);
      for (i = 0; i < N; i++) {
        if (nodes[i].pinned) continue;
        var px = disp[i * 2], py = disp[i * 2 + 1];
        var pl = Math.sqrt(px * px + py * py);
        if (pl < 1e-9) continue;
        step = Math.min(pl, cap);
        nodes[i].x += (px / pl) * step;
        nodes[i].y += (py / pl) * step;
      }

      /* 3e. 硬性碰撞 */
      if (iter > cfg.iterations * 0.3) {
        var minGap = cfg.minGap;
        for (i = 0; i < N; i++) {
          for (j = i + 1; j < N; j++) {
            dx = nodes[j].x - nodes[i].x; dy = nodes[j].y - nodes[i].y;
            d2 = dx * dx + dy * dy;
            if (d2 >= minGap * minGap || d2 < 1e-9) continue;
            d = Math.sqrt(d2);
            var push = (minGap - d) / 2;
            var qx = (dx / d) * push, qy = (dy / d) * push;
            nodes[j].x += qx; nodes[j].y += qy;
            nodes[i].x -= qx; nodes[i].y -= qy;
          }
        }
      }
    }

    /* -------------------------------------------- 4. 云统计（星系 / 星团） */
    var bc = MG.config.background;
    graph.regions.forEach(function (r) {
      var list = nodes.filter(function (nd) { return nd.regions.indexOf(r.id) >= 0; });
      if (!list.length) { r.stat = null; return; }
      var singles = list.filter(function (nd) { return !nd.isBorder; });
      var basis = singles.length >= 2 ? singles : list;
      var cx = r.center.x, cy = r.center.y, maxd = 0;
      basis.forEach(function (nd) { maxd = Math.max(maxd, U.dist(nd.x, nd.y, cx, cy)); });
      r.stat = {
        cx: cx, cy: cy, count: list.length,
        radius: Math.max(bc.cloudRadiusMin, maxd + bc.cloudMargin)
      };
    });

    graph.clusters.forEach(function (c) {
      if (!c.nodes.length) { c.stat = null; return; }
      var cx = 0, cy = 0;
      c.nodes.forEach(function (nd) { cx += nd.x; cy += nd.y; });
      cx /= c.nodes.length; cy /= c.nodes.length;
      var maxd = 0;
      c.nodes.forEach(function (nd) { maxd = Math.max(maxd, U.dist(nd.x, nd.y, cx, cy)); });
      c.stat = {
        cx: cx, cy: cy, count: c.nodes.length,
        radius: Math.max(ccfg.cloudMinRadius, maxd + ccfg.cloudPadding)
      };
      c.center = { x: cx, y: cy };   // 用实际重心，便于画星团级连线
    });

    /* ------------------------------------------------ 5. 内容包围盒 */
    graph.bbox = function () {
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      nodes.forEach(function (nd) {
        if (nd.x < minX) minX = nd.x;
        if (nd.x > maxX) maxX = nd.x;
        if (nd.y < minY) minY = nd.y;
        if (nd.y > maxY) maxY = nd.y;
      });
      if (!nodes.length) return { minX: -1, minY: -1, maxX: 1, maxY: 1 };
      return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
    };
  }

  function indexOf(arr, v) { for (var i = 0; i < arr.length; i++) if (arr[i].id === v) return i; return -1; }

  MG.computeLayout = computeLayout;
  MG.regionTarget = regionTarget;
})(typeof window !== 'undefined' ? window : globalThis);
