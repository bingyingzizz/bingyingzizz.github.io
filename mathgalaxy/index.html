<script>
/* ==========================================================================
   数学星图 · 电子云背景
   --------------------------------------------------------------------------
   每个数学板块（region）在背景里渲染一团半透明彩色云雾：
     · 一朵中心大雾 + 若干随机分布的软斑 + 每个节点周围的小斑
     · 越靠近板块边界越淡（斑块本身是径向渐变，中心浓、边缘透明）
     · 整块云先画在世界坐标的一张离屏纹理上，再随相机一起缩放绘制
       → 拖动/缩放时只做一次 drawImage，性能稳定
   页面大背景仍然是纯白。
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;

  /**
   * 建一张覆盖全部内容的云雾纹理。
   * isVisible 可选：藏起来的点不再往云里加斑；整团都藏光 → 连云一起收掉。
   * （所以「只看测度论」时，背景也跟着瘦成那一块，不会有空云飘着）
   */
  function buildTexture(graph, isVisible) {
    var bc = MG.config.background;
    var ok = isVisible || function () { return true; };
    var bb = graph.bbox();

    var pad = 300;
    var minX = bb.minX - pad, minY = bb.minY - pad;
    var maxX = bb.maxX + pad, maxY = bb.maxY + pad;
    var w = (maxX - minX) * bc.dilate;
    var h = (maxY - minY) * bc.dilate;
    minX -= (w - (maxX - minX)) / 2;
    minY -= (h - (maxY - minY)) / 2;

    var scale = bc.texScale;
    var cv = document.createElement('canvas');
    cv.width = Math.max(64, Math.round(w * scale));
    cv.height = Math.max(64, Math.round(h * scale));
    var ctx = cv.getContext('2d');

    // 世界坐标 → 纹理像素
    ctx.setTransform(scale, 0, 0, scale, -minX * scale, -minY * scale);

    var drawn = 0;
    (graph.regions || []).forEach(function (region) {
      if (!region.stat) return;                       // 空星系不画云
      var list = graph.nodes.filter(function (n) {
        return n.regions.indexOf(region.id) >= 0 && ok(n.id);
      });
      if (!list.length) return;                       // 点全被藏了 → 这一团云也收掉
      drawn++;
      paintRegion(ctx, region, list, bc);
    });

    // 星团：在星系云之上再叠一层更小更浓的云 → 看起来像星云里更密的结
    var cdrawn = 0;
    (graph.clusters || []).forEach(function (c) {
      if (!c.stat) return;
      var list = c.nodes.filter(function (n) { return ok(n.id); });
      if (!list.length) return;
      cdrawn++;
      paintCluster(ctx, c, list, graph, bc);
    });

    return {
      canvas: cv,
      x: minX, y: minY, w: w, h: h,
      scale: scale,
      regions: drawn,
      clusters: cdrawn
    };
  }

  /**
   * 星团的云：比星系云更小、更浓，用星团自己的颜色（没写就继承星系）
   * list 是这一团里「还看得见」的节点 —— 藏了一半，云也跟着缩一半。
   */
  function paintCluster(ctx, c, list, graph, bc) {
    var cc = MG.config.cluster;
    var galaxy = graph.galaxyOf ? graph.galaxyOf(c) : null;
    var rgb = U.hexToRgb(c.color || (galaxy ? galaxy.color : '#7A8699'));
    var R = fitRadius(list, cc.cloudMinRadius, cc.cloudPadding);
    var cx = centroid(list).x, cy = centroid(list).y;
    var rand = U.rngFrom(c.id, MG.config.seed);

    blob(ctx, rgb, cx, cy, R * 0.98, cc.cloudAlpha * 1.15);

    for (var i = 0; i < 7; i++) {
      var ang = rand() * Math.PI * 2;
      var rad = Math.sqrt(rand()) * R * 0.62;
      var br = R * U.lerp(0.34, 0.56, rand());
      blob(ctx, rgb, cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad,
        br, cc.cloudAlpha * U.lerp(0.6, 1.15, rand()));
    }

    list.forEach(function (n) {
      blob(ctx, rgb, n.x, n.y, R * 0.24, cc.cloudAlpha * 0.8);
    });
  }

  function centroid(list) {
    if (!list.length) return { x: 0, y: 0 };
    var x = 0, y = 0;
    list.forEach(function (n) { x += n.x; y += n.y; });
    return { x: x / list.length, y: y / list.length };
  }

  /** 一群点需要多大的云：最远的一颗 + 余量（有下限，免得缩成一点） */
  function fitRadius(list, minR, padding) {
    if (!list.length) return minR;
    var c = centroid(list), maxd = 0;
    list.forEach(function (n) { maxd = Math.max(maxd, U.dist(n.x, n.y, c.x, c.y)); });
    return Math.max(minR, maxd + padding);
  }

  function paintRegion(ctx, region, list, bc) {
    var rgb = U.hexToRgb(region.color);
    var cx = region.center.x, cy = region.center.y;   // 星系的云以星系中心为心（和星系名一致）

    /* ⚠️ 半径只能按「主要属于这个星系」的点算。
       跨星系的点（regions 里写了两个）会被布局摆到**另一个**星系那边去，
       拿它们定半径，一朵云就会撑满整屏 —— 拓扑学只有 12 个成员，其中 4 个
       是 analysis 那侧的（Borel、积 σ-代数…），曾把整屏糊成粉色。
       规则与 layout.js 里算 stat.radius 时一致：跨星系的点不参与。 */
    var core = list.filter(function (n) { return !n.isBorder; });
    var basis = core.length >= 2 ? core : list;
    var maxd = 0;
    basis.forEach(function (n) { maxd = Math.max(maxd, U.dist(n.x, n.y, cx, cy)); });
    var R = Math.max(bc.cloudRadiusMin, maxd + bc.cloudMargin);
    var rand = U.rngFrom(region.id, MG.config.seed);

    /* 1) 板块中心的大团雾 —— 界定「这块地方属于谁」 */
    blob(ctx, rgb, cx, cy, R, bc.centerAlpha * 1.15);

    /* 2) 随机软斑 —— 让云看起来不规整 */
    for (var i = 0; i < bc.blobsPerRegion; i++) {
      var ang = rand() * Math.PI * 2;
      var rad = Math.sqrt(rand()) * R * bc.spread;
      var x = cx + Math.cos(ang) * rad;
      var y = cy + Math.sin(ang) * rad;
      var br = R * U.lerp(bc.blobRadiusMin, bc.blobRadiusMax, rand());
      var a = bc.blobAlpha * U.lerp(0.55, 1.25, rand());
      blob(ctx, rgb, x, y, br, a);
    }

    /* 3) 每个（看得见的）节点周围的小斑 —— 让云的形状跟着内容走 */
    basis.forEach(function (n) {
      blob(ctx, rgb, n.x, n.y, R * 0.30, bc.nodeAlpha);
    });
  }

  function blob(ctx, rgb, x, y, r, alpha) {
    if (r <= 0 || alpha <= 0) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0.00, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + (alpha).toFixed(4) + ')');
    g.addColorStop(0.42, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + (alpha * 0.62).toFixed(4) + ')');
    g.addColorStop(0.74, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + (alpha * 0.22).toFixed(4) + ')');
    g.addColorStop(1.00, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  /** 按相机把云雾纹理画到屏幕（白底由页面提供） */
  function draw(ctx, cam, tex, dpr) {
    dpr = dpr || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    if (!tex) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var sx = tex.x * cam.k + cam.tx;
    var sy = tex.y * cam.k + cam.ty;
    var sw = tex.w * cam.k;
    var sh = tex.h * cam.k;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(tex.canvas, sx, sy, sw, sh);
  }

  MG.background = {
    buildTexture: buildTexture,
    draw: draw
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 前景渲染器（节点 / 连线 / 名称）
   --------------------------------------------------------------------------
   三种连线的画法：
     · 推出 implication  —— 黑色箭头，箭头指向被推出的结论；
                            多个前提时先汇聚到一点，再射向结论。
     · 等价 equivalence  —— 黑色直线，无箭头。
     · 定义引用 definition —— 蓝色（不透明度 50%）细线；同一直线上有多条时
                              会弯曲错开，避免糊成一团。
   全部在屏幕坐标里绘制，因此线宽 / 字号 / 箭头大小都可控。
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;
  var C = MG.config;
  var T = MG.theme;
  var GU = MG.graphUtil;

  /* --------------------------------------------------------- 光晕精灵缓存 */
  var glowCache = Object.create(null);
  function glowSprite(color) {
    if (glowCache[color]) return glowCache[color];
    var S = 96;
    var cv = document.createElement('canvas');
    cv.width = cv.height = S;
    var g2 = cv.getContext('2d');
    var rgb = U.hexToRgb(color);
    var g = g2.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.34)');
    g.addColorStop(0.35, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.17)');
    g.addColorStop(0.7, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.04)');
    g.addColorStop(1, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0)');
    g2.fillStyle = g;
    g2.fillRect(0, 0, S, S);
    glowCache[color] = cv;
    return cv;
  }

  /* ------------------------------------------------------------ 文本量缓存 */
  var textCache = Object.create(null);
  function measure(ctx, text, font) {
    var key = font + '|' + text;
    var w = textCache[key];
    if (w == null) {
      var old = ctx.font;
      ctx.font = font;
      w = ctx.measureText(text).width;
      ctx.font = old;
      textCache[key] = w;
    }
    return w;
  }

  /* ------------------------------------------------------------ LOD 工具 */
  function smoothstep(e0, e1, x) {
    if (e1 === e0) return x < e0 ? 0 : 1;
    var t = U.clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  /* ======================================================================= */
  function createRenderer(canvas, view) {
    var ctx = canvas.getContext('2d');
    var dpr = 1;
    var W = 0, H = 0;
    var geomCache = null;      // 本帧的连线几何
    var nodeCache = Object.create(null);

    /* 本帧各层的可见度（0~1），随缩放变化，由 computeLod() 填 */
    var lodA = {
      galaxyName: 1, clusterName: 1, nodeDot: 1,
      nodeName: 1, trunkName: 0, nodeEdge: 1, clusterLink: 0,
      trunkEdge: 0, trunkDim: 1, envelope: 0
    };

    /* ------------------------------------------------------------------
       LOD 阈值换算（写法见 config.lod 的注释）
         { rel: [a,b] } → 乘以「适配全部」的缩放 k₀
         { px:  [a,b] } → 屏幕上相邻两点的像素距离 ÷ idealDist
       ------------------------------------------------------------------ */
    var fitKCache = 0, fitKKey = '';

    /** 「适配全部」时相机该停在哪 —— 和 cam.fit() 用同一套公式 */
    function fitZoom() {
      var bb = view.graph.bbox();
      var key = [bb.minX, bb.minY, bb.maxX, bb.maxY, W, H].join(',');
      if (key === fitKKey) return fitKCache;
      var pad = Math.min(C.camera.fitPadding, Math.min(W, H) * 0.18);
      var aw = Math.max(40, W - pad * 2), ah = Math.max(40, H - pad * 2);
      var w = Math.max(1, bb.maxX - bb.minX), h = Math.max(1, bb.maxY - bb.minY);
      fitKCache = U.clamp(Math.min(aw / w, ah / h),
        Math.max(C.camera.minZoom, C.camera.fitMinZoom),
        Math.min(C.camera.maxZoom, C.camera.maxFitZoom));
      fitKKey = key;
      return fitKCache;
    }

    /** 把 config 里的阈值写法换算成绝对 k */
    function thr(spec) {
      if (spec.px) {
        var d = C.layout.idealDist || 120;
        return [spec.px[0] / d, spec.px[1] / d];
      }
      var k0 = fitZoom();
      return [spec.rel[0] * k0, spec.rel[1] * k0];
    }

    function computeLod() {
      var k = view.cam.k, L = C.lod;
      var tDot = thr(L.nodeDotIn), tEdge = thr(L.nodeEdgeIn), tName = thr(L.nodeNameIn);
      var tTrunk = thr(L.trunkNameIn), tGal = thr(L.galaxyNameIn);
      var tCIn = thr(L.clusterNameIn), tCOut = thr(L.clusterNameOut);
      var tCLink = thr(L.clusterLinkOut);

      lodA.nodeDot = smoothstep(tDot[0], tDot[1], k);
      lodA.nodeName = smoothstep(tName[0], tName[1], k);
      // 主干的名字更早出现：缩小时屏幕上剩下的就是「学习主线」
      lodA.trunkName = smoothstep(tTrunk[0], tTrunk[1], k);
      lodA.nodeEdge = smoothstep(tEdge[0], tEdge[1], k);
      // 主干内部的边：缩小时先于其它连线出现 —— 全图上也看得见「主线」
      var tSpine = thr(L.trunkEdgeIn);
      lodA.trunkEdge = smoothstep(tSpine[0], tSpine[1], k);
      // 全图时把「不在主干上」的点压暗 → 主线才浮得出来（放大后恢复原样）
      var tDim = thr(L.trunkDimIn);
      lodA.trunkDim = 1 - L.trunkDimMax * (1 - smoothstep(tDim[0], tDim[1], k));
      // 星团包络：中等缩放出现，放大后让位
      var tEnvIn = thr(L.envelopeIn), tEnvOut = thr(L.envelopeOut);
      lodA.envelope = smoothstep(tEnvIn[0], tEnvIn[1], k) * (1 - smoothstep(tEnvOut[0], tEnvOut[1], k));
      // 星团名：放大到看得见节点名时就退场，避免和节点名打架
      var cNameIn = smoothstep(tCIn[0], tCIn[1], k);
      var cNameOut = smoothstep(tCOut[0], tCOut[1], k);
      lodA.clusterName = cNameIn * (1 - cNameOut);
      // 星系名：最小的时候出现，星团名起来之后压掉一部分（但不清零，留个方位感）
      lodA.galaxyName = (1 - (L.galaxyNameHold || 0) * cNameIn) * smoothstep(tGal[0], tGal[1], k);
      // 星团级粗线与节点级细线交叉淡入淡出
      lodA.clusterLink = 1 - smoothstep(tCLink[0], tCLink[1], k);
    }

    /* ------------------------------------------------------------ 尺寸 */
    function resize() {
      dpr = Math.min(global.devicePixelRatio || 1, 2.5);
      var rect = canvas.getBoundingClientRect();
      var w = Math.max(1, Math.round(rect.width || global.innerWidth));
      var h = Math.max(1, Math.round(rect.height || global.innerHeight));
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      W = w; H = h;
      view.cam.setViewport(W, H);
      invalidate();
      return { w: W, h: H, dpr: dpr };
    }

    /* -------------------------------------------------------- 尺寸计算 */
    /** 半径倍率：按「是不是中心天体 / 度数多大」分档。
        分档表在 config.js 的 node.sizeTiers —— 那里写了为什么不再用
        ×1.32 / ×1.22 那种「叠乘」写法（差距太小，看不出层级）。 */
    function sizeMul(node) {
      if (!node) return 1;
      var t = C.node.sizeTiers;
      if (!t) {
        // 没有分档表时的老行为（保底）
        var m = 1;
        if (node.degree >= 5) m *= 1.22; else if (node.degree >= 3) m *= 1.1;
        if (node.isHub) m *= 1.32;
        return m;
      }
      if (node.isHub) return t.hub;
      var d = node.degree || 0;
      for (var i = 0; i < t.byDegree.length; i++) {
        if (d >= t.byDegree[i][0]) return t.byDegree[i][1];
      }
      return 1;
    }

    function nodeRadius(node) {
      var r = C.node.baseRadius * Math.pow(view.cam.k, C.node.radiusPower);
      r = U.clamp(r, C.node.minRadius, C.node.maxRadius);
      r *= sizeMul(node);
      // 放大之后也要有上限，否则高缩放下中心天体会顶到邻居
      if (C.node.sizeClamp) r = Math.min(r, C.node.sizeClamp);
      return r;
    }

    function labelFont() {
      var fs = U.clamp(C.node.labelSize * Math.pow(view.cam.k, 0.5), 9.5, 21);
      return fs;
    }

    /* ------------------------------------------------------ 连线几何 */
    var geomCam = { k: -1, tx: 0, ty: 0 };

    function buildGeometry() {
      var cam = view.cam;
      var geom = Object.create(null);
      var list = [];

      view.visible.forEach(function (e) {
        var g = computeEdge(e, cam);
        if (g) { geom[e.id] = g; list.push(g); }
      });
      geomCache = geom;
      geomCam = { k: cam.k, tx: cam.tx, ty: cam.ty };
      return list;
    }

    /** 保证命中检测用的是当前相机下的几何 */
    function ensureGeom() {
      var cam = view.cam;
      if (!geomCache || geomCam.k !== cam.k || geomCam.tx !== cam.tx || geomCam.ty !== cam.ty) {
        buildGeometry();
      }
    }

    function screenOf(n) { return view.cam.toScreen(n.x, n.y); }

    function trimTo(from, to, r) {
      var dx = to.x - from.x, dy = to.y - from.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      return { x: from.x + (dx / d) * r, y: from.y + (dy / d) * r, ux: dx / d, uy: dy / d, len: d };
    }

    function computeEdge(e, cam) {
      var byId = view.graph.byId;
      var quads = [], polys = [], arrow = null, glyph = null, ends = [];

      if (e.kind === 'definition') {
        var dn = byId[e.definition], un = byId[e.usedBy];
        if (!dn || !un) return null;
        var A = screenOf(dn), B = screenOf(un);
        var ra = nodeRadius(dn), rb = nodeRadius(un);
        var len = U.dist(A.x, A.y, B.x, B.y);
        if (len < 1) return null;
        var bend = (dn.id < un.id ? 1 : -1) * Math.min(len * C.edge.defCurvature, 90);
        var ctl = U.perpControl(A.x, A.y, B.x, B.y, bend);
        // 按控制点方向把端点缩到圆外
        var a2 = trimTo(A, ctl, ra + 1.5);
        var b2 = trimTo(B, ctl, rb + 1.5);
        var p0 = { x: a2.x, y: a2.y }, p2 = { x: b2.x, y: b2.y };
        quads.push({ p0: p0, p1: ctl, p2: p2 });
        polys.push(U.flattenQuad(p0, ctl, p2, 16));
        ends = [dn.id, un.id];
        return { edge: e, quads: quads, polys: polys, arrow: null, glyph: null, ends: ends };

      }

      if (e.kind === 'equivalence' || e.kind === 'analogy') {
        var na = byId[e.a], nb = byId[e.b];
        if (!na || !nb) return null;
        var Pa = screenOf(na), Pb = screenOf(nb);
        var r1 = nodeRadius(na), r2 = nodeRadius(nb);
        var q = trimTo(Pa, Pb, r1 + 1.5);
        var w = trimTo(Pb, Pa, r2 + 1.5);
        var seg = [{ x: q.x, y: q.y }, { x: w.x, y: w.y }];
        polys.push(seg);
        if (e.kind === 'equivalence') {
          glyph = { x: (q.x + w.x) / 2, y: (q.y + w.y) / 2, text: '⟺' };
        }
        ends = [e.a, e.b];
        return { edge: e, quads: [], polys: polys, arrow: null, glyph: glyph, ends: ends };
      }

      /* implication */
      var tg = byId[e.target];
      if (!tg) return null;
      var srcs = e.sources.map(function (id) { return byId[id]; }).filter(Boolean);
      if (!srcs.length) return null;
      var Pt = screenOf(tg), rt = nodeRadius(tg);
      var wc = { x: 0, y: 0 };

      if (srcs.length === 1) {
        var s0 = screenOf(srcs[0]);
        var rs0 = nodeRadius(srcs[0]);
        var dir = trimTo(Pt, s0, rt + 5);              // 从目标朝源方向退开
        var back = trimTo(s0, Pt, rs0 + 1.5);
        polys.push([{ x: back.x, y: back.y }, { x: dir.x, y: dir.y }]);
        arrow = { x: dir.x, y: dir.y, angle: Math.atan2(-dir.uy, -dir.ux) };
        ends = [srcs[0].id, tg.id];
      } else {
        // 多前提：先汇聚到一点，再射向结论
        srcs.forEach(function (s) { var p = screenOf(s); wc.x += p.x; wc.y += p.y; });
        wc.x /= srcs.length; wc.y /= srcs.length;
        var ddx = wc.x - Pt.x, ddy = wc.y - Pt.y;
        var dl = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
        var off = Math.min(C.edge.mergeOffset * cam.k, dl * 0.45);
        var J = { x: Pt.x + (ddx / dl) * off, y: Pt.y + (ddy / dl) * off };
        srcs.forEach(function (s) {
          var Ps = screenOf(s), rsp = nodeRadius(s);
          var st = trimTo(Ps, J, rsp + 1.5);
          var en = trimTo(J, Ps, 7);
          polys.push([{ x: st.x, y: st.y }, { x: en.x, y: en.y }]);
          ends.push(s.id);
        });
        var tip = trimTo(Pt, J, rt + 5);
        polys.push([{ x: J.x, y: J.y }, { x: tip.x, y: tip.y }]);
        arrow = { x: tip.x, y: tip.y, angle: Math.atan2(-tip.uy, -tip.ux) };
        ends.push(tg.id);
      }
      return { edge: e, quads: quads, polys: polys, arrow: arrow, glyph: null, ends: ends };
    }

    /* -------------------------------------------------------- 可见性权重 */
    /** 返回 0~1：聚焦模式下不相关的节点/边会被压暗 */
    function dimNode() { return C.focus.hideUnrelated ? 0 : C.focus.dimNodeAlpha; }
    function dimEdge() { return C.focus.hideUnrelated ? 0 : C.focus.dimEdgeAlpha; }

    /** 用户在左下角的「显示节点」面板里藏起来的点，一律不画 */
    function nodeOk(id) { return !view.isNodeVisible || view.isNodeVisible(id); }

    /** 这一组里还有几颗星看得见（全藏光的星系/星团连名字都不出） */
    function visibleIn(list) {
      var c = 0;
      for (var i = 0; i < list.length; i++) if (nodeOk(list[i].id)) c++;
      return c;
    }

    function regionHasVisible(rid) {
      var ns = view.graph.nodes;
      for (var i = 0; i < ns.length; i++) {
        if (ns[i].regions.indexOf(rid) >= 0 && nodeOk(ns[i].id)) return true;
      }
      return false;
    }

    function alphaForNode(id) {
      var f = view.focus;
      if (!f) return 1;
      if (f.type === 'node') return (id === f.id || isNeighbor(id, f.id)) ? 1 : dimNode();
      if (f.type === 'edge') {
        var e = edgeById(f.id);
        return (e && GU.edgeNodes(e).indexOf(id) >= 0) ? 1 : dimNode();
      }
      return 1;
    }

    function alphaForEdge(e) {
      var f = view.focus;
      if (!f) return 1;
      if (f.type === 'node') return GU.edgeNodes(e).indexOf(f.id) >= 0 ? 1 : dimEdge();
      if (f.type === 'edge') return e.id === f.id ? 1 : dimEdge();
      return 1;
    }

    function isNeighbor(id, of) {
      var adj = view.graph.adj[of];
      return !!adj && adj.indexOf(id) >= 0;
    }

    /** 这条边的两端是不是都在主干上（= 学习主线的骨架）。结果缓存在边上。 */
    function isSpine(e) {
      if (e._spine == null) {
        var ok = !GU.isWeak(e) && GU.edgeNodes(e).length > 0;
        if (ok) {
          GU.edgeNodes(e).forEach(function (id) {
            var n = view.graph.byId[id];
            if (!n || !n.trunk) ok = false;
          });
        }
        e._spine = ok;
      }
      return e._spine;
    }

    function edgeById(id) {
      for (var i = 0; i < view.visible.length; i++) if (view.visible[i].id === id) return view.visible[i];
      return null;
    }

    /* ============================================================ 绘制 */
    /* 本帧已被「星系名 / 装置名」占掉的矩形 —— 节点名不许压上去 */
    var nameBoxes = [];

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      var geoms = buildGeometry();
      var cam = view.cam;
      computeLod();
      nameBoxes.length = 0;

      /* ---------- 0. 星团包络（每个「装置」一圈边界，垫在最底下） ---------- */
      drawEnvelopes();

      /* ---------- 0b. 星团级粗线（缩小时才出现，整块对整块） ---------- */
      drawClusterLinks();

      /* ---------- 1. 节点级连线 ---------- */
      var defs = [], eqs = [], imps = [], anas = [];
      geoms.forEach(function (g) {
        if (g.edge.kind === 'definition') defs.push(g);
        else if (g.edge.kind === 'equivalence') eqs.push(g);
        else if (g.edge.kind === 'analogy') anas.push(g);
        else imps.push(g);
      });

      drawEdges(anas);          // 弱边垫在最底下（平时几乎看不见）
      drawEdges(defs);
      drawEdges(eqs);
      drawEdges(imps);
      geoms.forEach(function (g) { if (g.arrow) drawArrow(g); });

      /* ---------- 2. 节点 ---------- */
      if (lodA.nodeDot > 0.02) {
        view.graph.nodes.forEach(function (n) { drawNode(n); });
      }
      /* ---------- 3. 名称（星系名 → 星团名 → 节点名，逐层交接） ---------- */
      if (lodA.galaxyName > 0.02) drawGalaxyNames();
      if (lodA.clusterName > 0.02) drawClusterNames();
      if (C.showLabels) drawLabels();
    }

    /* ------------------------------------------------ 星系名 */
    function drawGalaxyNames() {
      var a = lodA.galaxyName;
      var fs = U.clamp(15 * Math.pow(view.cam.k, 0.30), 13, 34);
      ctx.save();
      ctx.font = '700 ' + fs.toFixed(1) + 'px ' + T.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      (view.graph.regions || []).forEach(function (r) {
        if (!r.stat || !r.name) return;
        // 整个星系的点都被藏起来了 → 只剩云雾，名字也不必出
        if (view.isNodeVisible && !regionHasVisible(r.id)) return;
        var p = view.cam.toScreen(r.stat.cx, r.stat.cy);
        if (p.x < -300 || p.x > W + 300 || p.y < -200 || p.y > H + 200) return;
        var text = r.name;
        var tw = ctx.measureText(text).width;
        var ls = fs * 0.18;
        var bw = tw + ls * (text.length - 1) + 26, bh = fs + 14;
        // 星系名之间也尽量不叠（它们最先占位，所以通常就在原位）
        var slot = placeName(p.x, p.y, bw, bh);
        var cy = slot ? slot.y : p.y;
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(255,255,255,0.86)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(p.x - bw / 2, cy - bh / 2, bw, bh, bh / 2);
        else ctx.rect(p.x - bw / 2, cy - bh / 2, bw, bh);
        ctx.fill();
        ctx.strokeStyle = U.rgba(r.color, 0.55);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // 手动加字距
        var chars = text.split('');
        var total = tw + ls * (chars.length - 1);
        var cx = p.x - total / 2;
        ctx.fillStyle = 'rgba(26,28,34,0.92)';
        ctx.textAlign = 'left';
        chars.forEach(function (ch) {
          ctx.fillText(ch, cx, cy + 0.5);
          cx += ctx.measureText(ch).width + ls;
        });
        ctx.textAlign = 'center';
        ctx.globalAlpha = 1;
        nameBoxes.push({ x0: p.x - bw / 2, y0: cy - bh / 2, x1: p.x + bw / 2, y1: cy + bh / 2 });
      });
      ctx.restore();
    }

    /* ------------------------------------------------ 星团级连线 */
    function drawClusterLinks() {
      var a = lodA.clusterLink;
      if (a <= 0.02) return;
      var links = view.graph.clusterLinks || [];
      if (!links.length) return;
      var cfgL = C.clusterLink;
      var maxCount = 1;
      links.forEach(function (l) { if (l.count > maxCount) maxCount = l.count; });

      ctx.save();
      ctx.lineCap = 'round';
      links.forEach(function (l) {
        if (l.count < cfgL.minEdges) return;
        var A = view.graph.clusterById[l.a], B = view.graph.clusterById[l.b];
        if (!A || !B || !A.stat || !B.stat) return;
        if (view.isNodeVisible && (!visibleIn(A.nodes) || !visibleIn(B.nodes))) return;
        var p0 = view.cam.toScreen(A.stat.cx, A.stat.cy);
        var p1 = view.cam.toScreen(B.stat.cx, B.stat.cy);
        var len = U.dist(p0.x, p0.y, p1.x, p1.y);
        if (len < 2) return;
        var t = Math.min(1, l.count / Math.max(2, maxCount));
        var w = U.lerp(cfgL.widthMin, cfgL.widthMax, Math.sqrt(t)) * Math.min(1.4, Math.max(0.6, view.cam.k));
        var bend = (l.a < l.b ? 1 : -1) * len * cfgL.curve;
        var ctl = U.perpControl(p0.x, p0.y, p1.x, p1.y, bend);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.quadraticCurveTo(ctl.x, ctl.y, p1.x, p1.y);
        ctx.lineWidth = w;
        ctx.strokeStyle = 'rgba(' + cfgL.color + ',' + (cfgL.alpha * a).toFixed(3) + ')';
        ctx.stroke();
      });
      ctx.restore();
    }

    /* ------------------------------------------------ 星团包络 */
    /**
     * 给一堆点画一圈闭合的平滑边界：绕一圈取 samples 个方向，
     * 每个方向取「落在该方向 ±半个扇区内的点」里最远的那个，再外扩 pad；
     * 半径序列平滑两遍消尖角，最后用二次贝塞尔穿过相邻采样点的中点。
     * （不做凸包 —— 凸包会把 L 形的团撑肥，贴不住形状。）
     */
    function envelopePoints(list, pad, samples, smooth) {
      var cx = 0, cy = 0;
      list.forEach(function (n) { cx += n.x; cy += n.y; });
      cx /= list.length; cy /= list.length;

      var half = Math.PI / samples;
      var r = [];
      for (var i = 0; i < samples; i++) {
        var th = i * 2 * Math.PI / samples;
        var cos = Math.cos(th), sin = Math.sin(th);
        var best = 0;
        list.forEach(function (n) {
          var dx = n.x - cx, dy = n.y - cy;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 1e-6) return;
          // 点与这个方向的夹角：用 |cos| 判，超过半个扇区就不算
          if ((dx * cos + dy * sin) / dist < Math.cos(half)) return;
          if (dist > best) best = dist;
        });
        if (best === 0) {                       // 这个方向没点 → 退回支撑函数
          list.forEach(function (n) {
            var v = (n.x - cx) * cos + (n.y - cy) * sin;
            if (v > best) best = v;
          });
        }
        r.push(best + pad);
      }
      for (var s = 0; s < (smooth || 0); s++) {  // 平滑
        var out = [];
        for (var j = 0; j < samples; j++) {
          out.push((r[(j - 1 + samples) % samples] + r[j] * 2 + r[(j + 1) % samples]) / 4);
        }
        r = out;
      }
      return { cx: cx, cy: cy, r: r, samples: samples };
    }

    /** 把包络采样点画成一条闭合的平滑曲线 */
    function traceEnvelope(env, cam) {
      var N = env.samples;
      var pt = function (i) {
        var th = (i % N) * 2 * Math.PI / N;
        var rr = env.r[((i % N) + N) % N];
        return cam.toScreen(env.cx + Math.cos(th) * rr, env.cy + Math.sin(th) * rr);
      };
      ctx.beginPath();
      var p0 = pt(0), pN = pt(N - 1);
      ctx.moveTo((pN.x + p0.x) / 2, (pN.y + p0.y) / 2);
      for (var i = 0; i < N; i++) {
        var cur = pt(i), nxt = pt(i + 1);
        ctx.quadraticCurveTo(cur.x, cur.y, (cur.x + nxt.x) / 2, (cur.y + nxt.y) / 2);
      }
      ctx.closePath();
    }

    function drawEnvelopes() {
      var a = lodA.envelope;
      if (a <= 0.02) return;
      var cfgE = C.envelope;
      ctx.save();
      ctx.lineJoin = 'round';
      (view.graph.clusters || []).forEach(function (c) {
        if (!c.nodes || !c.nodes.length) return;
        var list = c.nodes.filter(function (n) { return nodeOk(n.id); });
        if (list.length < 2) return;              // 一个点画不出包络
        var env = envelopePoints(list, cfgE.pad, cfgE.samples, cfgE.smooth);
        var gal = view.graph.galaxyOf ? view.graph.galaxyOf(c) : null;
        var rgb = U.hexToRgb(c.color || (gal ? gal.color : '#7A8699'));

        traceEnvelope(env, view.cam);
        ctx.fillStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + (cfgE.fillAlpha * a).toFixed(3) + ')';
        ctx.fill();
        ctx.lineWidth = cfgE.width;
        ctx.strokeStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + (cfgE.strokeAlpha * a).toFixed(3) + ')';
        ctx.stroke();
      });
      ctx.restore();
    }

    /* ------------------------------------------------ 星团名 */
    /** 给一个名字找位置：先试原位，再试上下几个偏移；都不行就返回 null。
        依据是 nameBoxes（星系名 → 装置名 → 节点名，按这个优先级依次占位）。 */
    function placeName(cx, cy, bw, bh) {
      var step = bh + 6;
      var gaps = [0, -step, step, -2 * step, 2 * step];
      for (var gi = 0; gi < gaps.length; gi++) {
        var y = cy + gaps[gi];
        var box = { x0: cx - bw / 2, y0: y - bh / 2, x1: cx + bw / 2, y1: y + bh / 2 };
        var hit = false;
        for (var i = 0; i < nameBoxes.length; i++) {
          var b = nameBoxes[i];
          if (box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0) { hit = true; break; }
        }
        if (!hit) return { y: y, box: box };
      }
      return null;
    }

    function drawClusterNames() {
      var a = lodA.clusterName;
      var fs = U.clamp(C.cluster.labelSize * Math.pow(view.cam.k, 0.42), 11, 26);
      ctx.save();
      ctx.font = '700 ' + fs.toFixed(1) + 'px ' + T.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      (view.graph.clusters || []).forEach(function (c) {
        if (!c.stat || !c.name) return;
        if (view.isNodeVisible && !visibleIn(c.nodes)) return;   // 整团都藏起来了
        var p = view.cam.toScreen(c.stat.cx, c.stat.cy);
        if (p.x < -300 || p.x > W + 300 || p.y < -200 || p.y > H + 200) return;
        var text = c.name;
        var tw = ctx.measureText(text).width;
        var pad = C.cluster.namePad;
        var bw = tw + pad * 2, bh = fs + 9;
        // ⚠️ 装置名之间也要互相避让：两个团挨得近时（比如「代数结构」与
        //    「向量空间的基」）名字会直接叠在一起，读不清。放不下就不画 ——
        //    包络还在，放大一点名字自然回来。
        var slot = placeName(p.x, p.y, bw, bh);
        if (!slot) return;
        var y = slot.y;
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(p.x - bw / 2, y - bh / 2, bw, bh, bh / 2);
        else ctx.rect(p.x - bw / 2, y - bh / 2, bw, bh);
        ctx.fill();
        var g = view.graph.galaxyOf(c);
        if (g) { ctx.strokeStyle = U.rgba(g.color, 0.5); ctx.lineWidth = 1.2; ctx.stroke(); }
        // 深色字，保证在云上读得清
        ctx.fillStyle = 'rgba(30,32,40,0.90)';
        ctx.fillText(text, p.x, y + 0.5);
        ctx.globalAlpha = 1;
        nameBoxes.push(slot.box);
      });
      ctx.restore();
    }

    function drawEdges(list) {
      list.forEach(function (g) {
        var e = g.edge;
        var style = T.edgeStyles[e.kind];
        var spine = isSpine(e);
        // 主干骨架：它有自己的淡入曲线，缩小时也能看见；放大后让位给全部连线
        var a = alphaForEdge(e) * Math.max(lodA.nodeEdge, spine ? lodA.trunkEdge : 0);
        if (a <= 0.02) return;

        var active = isEdgeActive(g);
        var w = (e.kind === 'implication' ? C.edge.implicationWidth
          : e.kind === 'equivalence' ? C.edge.equivalenceWidth
            : e.kind === 'analogy' ? T.edgeStyles.analogy.width
              : C.edge.definitionWidth) * (active ? 1.85 : 1);

        // 全图尺度：主干画成一条低调的暖色细线，不抢云雾和装置名
        var spineOnly = spine && lodA.nodeEdge < 0.9;
        if (spineOnly) { a *= 0.55 + 0.45 * lodA.nodeEdge; w = 1.25; }

        if (e.kind === 'definition' && !C.showDefinitionLines) return;

        // 弱边：不开探索模式时压得很淡，开了才提亮
        var isWeak = GU.isWeak(e);
        if (isWeak) {
          var base = C.exploreMode ? C.analogy.exploreAlpha : C.analogy.dimAlpha;
          a = a * (base / (style.alpha || 1));
          if (a <= 0.02) return;
          w *= active ? 1.6 : 1;
        }

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = w;
        if (isWeak) ctx.setLineDash(C.analogy.dash);

        if (spineOnly) {
          ctx.strokeStyle = U.rgba(T.spineColor || 'B4661A', a);
        } else if (e.kind === 'definition' || e.kind === 'analogy') {
          var alpha = (style.alpha != null ? style.alpha : 1) * a;
          ctx.strokeStyle = 'rgba(' + style.color + ',' + alpha.toFixed(3) + ')';
        } else {
          ctx.strokeStyle = U.rgba(style.color, a);
        }

        ctx.beginPath();
        g.polys.forEach(function (pts, i) {
          if (g.quads[i]) {
            var q = g.quads[i];
            ctx.moveTo(q.p0.x, q.p0.y);
            ctx.quadraticCurveTo(q.p1.x, q.p1.y, q.p2.x, q.p2.y);
          } else {
            ctx.moveTo(pts[0].x, pts[0].y);
            for (var k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
          }
        });
        ctx.stroke();

        // 等价线中点画一个 ⟺（用白色描边做底，而不是白方块，免得在云上留个补丁）
        if (g.glyph && cam_eqVisible()) {
          ctx.font = '600 ' + Math.round(U.clamp(13 * Math.pow(view.cam.k, 0.4), 11, 18)) + 'px ' + T.font;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = 'rgba(255,255,255,' + (0.95 * a).toFixed(3) + ')';
          ctx.strokeText(g.glyph.text, g.glyph.x, g.glyph.y + 0.5);
          ctx.fillStyle = U.rgba(T.edgeStyles.equivalence.color, 0.92 * a);
          ctx.fillText(g.glyph.text, g.glyph.x, g.glyph.y + 0.5);
        }
        ctx.restore();
      });
    }

    function cam_eqVisible() { return view.cam.k >= C.edge.equivalenceGlyph; }

    function isEdgeActive(g) {
      var e = g.edge;
      if (view.hover && view.hover.type === 'edge' && view.hover.id === e.id) return true;
      if (view.focus && view.focus.type === 'edge' && view.focus.id === e.id) return true;
      if (view.focus && view.focus.type === 'node' && GU.edgeNodes(e).indexOf(view.focus.id) >= 0) return true;
      if (view.hover && view.hover.type === 'node' && GU.edgeNodes(e).indexOf(view.hover.id) >= 0) return true;
      return false;
    }

    function drawArrow(g) {
      var e = g.edge;
      var a = alphaForEdge(e) * lodA.nodeEdge;
      if (a <= 0.02) return;
      var sz = U.clamp(C.edge.arrowSize * Math.pow(view.cam.k, 0.35), 6, 17) * (isEdgeActive(g) ? 1.2 : 1);
      var x = g.arrow.x, y = g.arrow.y, ang = g.arrow.angle;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-sz, sz * 0.42);
      ctx.lineTo(-sz * 0.72, 0);
      ctx.lineTo(-sz, -sz * 0.42);
      ctx.closePath();
      ctx.fillStyle = U.rgba(T.edgeStyles.implication.color, a);
      ctx.fill();
      ctx.restore();
    }

    /* ---------------------------------------------------------- 节点 */
    function drawNode(n) {
      if (!nodeOk(n.id)) return;                 // 被藏起来的点：不画（连线也已一并去掉）
      var p = screenOf(n);
      var r = nodeRadius(n);
      var a = alphaForNode(n.id) * lodA.nodeDot * (isTrunk(n) ? 1 : lodA.trunkDim);
      if (a <= 0.02) return;

      var st = MG.typeStyle(n.type);
      var isFocus = view.focus && view.focus.type === 'node' && view.focus.id === n.id;
      var isHover = (view.hover && view.hover.type === 'node' && view.hover.id === n.id) ||
        (view.hover && view.hover.type === 'edge' && edgeById(view.hover.id) &&
          GU.edgeNodes(edgeById(view.hover.id)).indexOf(n.id) >= 0);

      // 光晕
      if (C.node.glow) {
        var gs = glowSprite(st.color);
        var gsz = r * 5.4;
        ctx.globalAlpha = a * (isFocus || isHover ? 1 : 0.72);
        ctx.drawImage(gs, p.x - gsz / 2, p.y - gsz / 2, gsz, gsz);
        ctx.globalAlpha = 1;
      }

      // 实心点 + 白圈
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = U.rgba(st.color, a);
      ctx.fill();
      ctx.lineWidth = Math.max(1.2, C.node.ringWidth * Math.min(1, view.cam.k + 0.35));
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.95 * a).toFixed(3) + ')';
      ctx.stroke();

      // 选中 / 悬停的外环
      if (isFocus || isHover) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 5.5, 0, Math.PI * 2);
        ctx.lineWidth = isFocus ? 2 : 1.4;
        ctx.strokeStyle = U.rgba(st.color, (isFocus ? 0.95 : 0.55) * a);
        ctx.stroke();
      } else if (n.isHub) {
        // 星团的中心天体：外面套一道细环，全图尺度上也认得出「这个装置的核心」
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 3.0, 0, Math.PI * 2);
        ctx.lineWidth = 1.25;
        ctx.strokeStyle = U.rgba(st.color, 0.6 * a);
        ctx.stroke();
      }
    }

    /* ---------------------------------------------------------- 名称 */
    function isTrunk(n) { return !!(n && n.trunk); }

    function drawLabels() {
      var k = view.cam.k;
      var fs = labelFont();
      // 连主干的名字都还没到出现的时候 → 只画聚焦/悬停的那一个
      if (lodA.nodeName <= 0.02 && lodA.trunkName <= 0.02) { drawKeyLabels(fs); return; }

      // 缩得很小时只留「重要」节点的名字；重叠的名字一律让位（永远去重叠）
      var keepAll = k >= C.node.labelMinZoomAll;
      // 星系名 / 装置名先占位（它们在上面已经画过了）—— 节点名不许压上去
      var placed = nameBoxes.slice();
      var nodes = view.graph.nodes.slice().sort(function (a, b) {
        return labelPriority(b) - labelPriority(a);
      });

      ctx.font = '600 ' + fs + 'px ' + T.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      nodes.forEach(function (n) {
        if (!nodeOk(n.id)) return;
        var trunk = isTrunk(n);
        // 主干的名字用更早出现的那条曲线；其余仍按原节奏
        var nameAlpha = trunk ? Math.max(lodA.nodeName, lodA.trunkName) : lodA.nodeName;
        if (nameAlpha <= 0.06) return;
        var a = alphaForNode(n.id);
        var isSpecial = (view.focus && view.focus.id === n.id) ||
          (view.hover && view.hover.type === 'node' && view.hover.id === n.id);
        if (a <= 0.06) return;
        // 缩小时只画重要的：主干一律画，其余要 degree >= 3
        if (!keepAll && !isSpecial && !trunk && n.degree < 3) return;

        var p = screenOf(n);
        var r = nodeRadius(n);
        var text = n.label;
        var tw = measure(ctx, text, ctx.font);
        var x = p.x, y = p.y + r + C.node.labelOffset * Math.max(k, 0.62);
        var box = { x0: x - tw / 2 - C.node.labelPad, y0: y - 1, x1: x + tw / 2 + C.node.labelPad, y1: y + fs + 2 };

        if (!isSpecial) {
          var hit = false;
          for (var i = 0; i < placed.length; i++) {
            var b = placed[i];
            if (box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0) { hit = true; break; }
          }
          if (hit) return;
        }
        placed.push(box);

        var alpha = a * (isSpecial ? 1 : 0.92 * nameAlpha);
        ctx.lineWidth = Math.max(2.5, fs * 0.28);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * alpha).toFixed(3) + ')';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = isSpecial ? U.rgba(MG.typeStyle(n.type).color, alpha) : 'rgba(28,28,30,' + alpha.toFixed(3) + ')';
        ctx.fillText(text, x, y);
      });
    }

    /** 缩得太小时只画关键节点的名字 */
    function drawKeyLabels(fs) {
      var special = [];
      if (view.focus && view.focus.type === 'node') special.push(view.focus.id);
      if (view.hover && view.hover.type === 'node') special.push(view.hover.id);
      if (!special.length) return;
      ctx.font = '600 ' + Math.max(fs, 12) + 'px ' + T.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      special.forEach(function (id) {
        var n = view.graph.byId[id];
        if (!n || !nodeOk(id)) return;
        var p = screenOf(n), r = nodeRadius(n);
        var y = p.y + r + 10;
        ctx.lineWidth = 3;
        ctx.strokeStyle = T.labelHalo;
        ctx.strokeText(n.label, p.x, y);
        ctx.fillStyle = T.ink;
        ctx.fillText(n.label, p.x, y);
      });
    }

    function labelPriority(n) {
      var s = n.degree * 10;
      if (n.trunk) s += 400;                       // 主干的名字优先留下（去重叠时赢）
      if (view.focus && view.focus.id === n.id) s += 1000;
      if (view.hover && view.hover.id === n.id) s += 800;
      if (n.type === 'definition') s -= 6;
      return s;
    }

    /* ========================================================== 命中检测 */
    function hitTest(sx, sy) {
      ensureGeom();
      // 先节点
      var best = null, bestD = Infinity;
      view.graph.nodes.forEach(function (n) {
        if (!nodeOk(n.id)) return;
        var a = alphaForNode(n.id);
        if (a <= 0.06) return;
        var p = screenOf(n);
        var r = nodeRadius(n) + 9;      // 给触摸留点余量
        var d = U.dist(sx, sy, p.x, p.y);
        if (d <= r && d < bestD) { bestD = d; best = { type: 'node', id: n.id }; }
      });
      if (best) return best;

      // 再连线
      var tol = C.edge.hitTolerance;
      var list = geomCache ? Object.keys(geomCache).map(function (k) { return geomCache[k]; }) : [];
      var hitEdge = null, hitD = Infinity;
      list.forEach(function (g) {
        if (g.edge.kind === 'definition' && !C.showDefinitionLines) return;
        // 弱边没开探索模式时不响应点击（它本来就几乎看不见）
        if (GU.isWeak(g.edge) && !C.exploreMode) return;
        var a = alphaForEdge(g.edge);
        if (a <= 0.06) return;
        g.polys.forEach(function (pts) {
          var d = U.pointPolylineDist(sx, sy, pts);
          if (d < tol && d < hitD) { hitD = d; hitEdge = g.edge.id; }
        });
        if (g.arrow) {
          var d2 = U.dist(sx, sy, g.arrow.x, g.arrow.y);
          if (d2 < tol + 6 && d2 < hitD) { hitD = d2; hitEdge = g.edge.id; }
        }
      });
      return hitEdge ? { type: 'edge', id: hitEdge } : null;
    }

    function invalidate() { geomCache = null; }

    return {
      resize: resize,
      draw: draw,
      hitTest: hitTest,
      invalidate: invalidate,
      nodeRadius: nodeRadius,
      screenOf: screenOf,
      get size() { return { w: W, h: H }; }
    };
  }

  MG.createRenderer = createRenderer;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 交互
   --------------------------------------------------------------------------
   · 拖拽平移
   · 滚轮缩放（可在工具条里切成「滚轮平移」，照顾触控板）
   · 双指捏合缩放 + 双指拖动
   · 悬停高亮、点击选中
   命中检测交给 renderer（节点 → 优先；连线 → 次之）。
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;
  var C = MG.config;

  function createInteraction(canvas, view, hooks) {
    var pointers = new Map();
    var mode = 'idle';
    var downAt = null;       // 屏幕坐标
    var downTime = 0;
    var moved = false;
    var lastPinch = null;
    var hoverDirty = false;
    var rafPending = false;

    function localPos(e) {
      var r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function requestDraw() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(function () { rafPending = false; hooks.draw(); });
    }

    /* ------------------------------------------------------- 指针按下 */
    function onPointerDown(e) {
      if (e.button != null && e.button !== 0 && e.pointerType === 'mouse') return;
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      var p = localPos(e);
      pointers.set(e.pointerId, p);
      view.cam.stopAnimation();

      if (pointers.size === 1) {
        mode = 'pan';
        downAt = p;
        lastPoint = p;           // 平移增量的基准点
        downTime = performance.now ? performance.now() : Date.now();
        moved = false;
      } else if (pointers.size === 2) {
        mode = 'pinch';
        moved = true;
        lastPinch = pinchState();
      }
      requestDraw();
    }

    function pinchState() {
      var pts = Array.from(pointers.values());
      if (pts.length < 2) return null;
      var a = pts[0], b = pts[1];
      return {
        d: Math.max(1, U.dist(a.x, a.y, b.x, b.y)),
        cx: (a.x + b.x) / 2,
        cy: (a.y + b.y) / 2
      };
    }

    /* ------------------------------------------------------- 指针移动 */
    function onPointerMove(e) {
      var p = localPos(e);

      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);

      if (mode === 'pinch' && pointers.size >= 2) {
        var now = pinchState();
        if (lastPinch && now) {
          view.cam.panBy(now.cx - lastPinch.cx, now.cy - lastPinch.cy);
          view.cam.zoomBy(now.d / lastPinch.d, now.cx, now.cy);
          lastPinch = now;
        }
        requestDraw();
        scheduleHover(p);
        return;
      }

      if (mode === 'pan' && pointers.size === 1 && pointers.has(e.pointerId)) {
        var dx = p.x - lastPoint.x, dy = p.y - lastPoint.y;
        if (!moved && Math.abs(p.x - downAt.x) + Math.abs(p.y - downAt.y) > 4) {
          moved = true;
          canvas.classList.add('dragging');
        }
        if (moved) { view.cam.panBy(dx, dy); lastPoint = p; requestDraw(); }
        return;
      }

      scheduleHover(p);
    }

    var lastPoint = { x: 0, y: 0 };
    var hoverPos = { x: 0, y: 0 };

    function scheduleHover(p) {
      hoverPos = p;
      if (hoverDirty) return;
      hoverDirty = true;
      requestAnimationFrame(function () {
        hoverDirty = false;
        if (mode === 'pinch') return;
        if (mode === 'pan' && moved) { applyHover(null); return; }  // 拖拽时不谈悬停
        var hit = hooks.hitTest(hoverPos.x, hoverPos.y);
        applyHover(hit);
      });
    }

    function applyHover(hit) {
      var cur = view.hover;
      var same = (cur == null && hit == null) ||
        (cur && hit && cur.type === hit.type && cur.id === hit.id);
      canvas.classList.toggle('pointing', !!hit);
      if (same) return;
      view.hover = hit;
      hooks.onHover && hooks.onHover(hit);
      requestDraw();
    }

    /* ------------------------------------------------------- 指针抬起 */
    function onPointerUp(e) {
      var p = localPos(e);
      var wasMode = mode;
      pointers.delete(e.pointerId);
      canvas.releasePointerCapture && canvas.releasePointerCapture(e.pointerId);

      if (pointers.size === 0) {
        canvas.classList.remove('dragging');
        if (mode === 'pan' && !moved) {
          var dt = (performance.now ? performance.now() : Date.now()) - downTime;
          if (dt < 700) {
            var hit = hooks.hitTest(p.x, p.y);
            hooks.onPick && hooks.onPick(hit);
          }
        }
        mode = 'idle';
        lastPinch = null;
        scheduleHover(p);
      } else if (pointers.size === 1) {
        mode = 'pan';
        lastPoint = Array.from(pointers.values())[0];
        downAt = lastPoint;
        moved = true;
        lastPinch = null;
      } else {
        mode = 'idle';
      }
      requestDraw();
      return wasMode;
    }

    function onPointerCancel(e) {
      pointers.delete(e.pointerId);
      if (pointers.size === 0) { mode = 'idle'; canvas.classList.remove('dragging'); }
      lastPinch = pinchState();
    }

    /* ------------------------------------------------------------ 滚轮 */
    function onWheel(e) {
      e.preventDefault();
      var p = localPos(e);
      var isPinch = e.ctrlKey || e.metaKey;   // 触控板捏合 → 浏览器给的是 ctrl+wheel
      var zoom = isPinch || C.wheelZooms;

      if (zoom) {
        // 归一化不同设备的 delta
        var unit = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? 400 : 1);
        var d = e.deltaY * unit;
        var factor = Math.exp(-d * C.camera.wheelGain);
        view.cam.stopAnimation();
        if (view.cam.zoomBy(factor, p.x, p.y)) requestDraw();
      } else {
        var unit2 = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? 400 : 1);
        view.cam.panBy(-e.deltaX * unit2, -e.deltaY * unit2);
        requestDraw();
      }
    }

    /* --------------------------------------------------------- 绑定 */
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerCancel);
    canvas.addEventListener('pointerleave', function () { applyHover(null); });
    canvas.addEventListener('wheel', onWheel, { passive: false });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    return {
      destroy: function () {
        canvas.removeEventListener('pointerdown', onPointerDown);
        canvas.removeEventListener('pointermove', onPointerMove);
        canvas.removeEventListener('pointerup', onPointerUp);
        canvas.removeEventListener('pointercancel', onPointerCancel);
        canvas.removeEventListener('wheel', onWheel);
      }
    };
  }

  MG.createInteraction = createInteraction;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 搜索
   --------------------------------------------------------------------------
   在左上角输入框里搜：节点名称 / 英文名 / id / 标签 / 陈述正文 / 板块名。
   键盘：↑ ↓ 选择，Enter 跳转，Esc 清空。
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;

  function createSearch(box, input, results, view, hooks) {
    var items = [];
    var active = -1;
    var open = false;

    /* --------------------------------------------------------- 建立索引 */
    var index = [];
    function reindex() {
      index = view.graph.nodes.map(function (n) {
        var regions = n.regions.map(function (r) {
          var reg = view.graph.regionById[r];
          return reg ? (reg.name + ' ' + (reg.en || '')) : r;
        }).join(' ');
        var st = U.plain(n.statement);
        var nt = U.plain(n.notes);
        var hay = [
          n.label, n.title, n.id, n.type, MG.typeStyle(n.type).name,
          (n.tags || []).join(' '), regions, st, nt
        ].join('\n').toLowerCase();
        return { node: n, hay: hay, label: n.label, title: n.title, st: st };
      });
    }

    /* ----------------------------------------------------------- 打分 */
    function score(entry, q) {
      var label = entry.label.toLowerCase();
      var title = entry.title.toLowerCase();
      var s = 0;
      if (label === q) s += 1000;
      if (label.indexOf(q) === 0) s += 500;
      if (label.indexOf(q) >= 0) s += 260;
      if (title.indexOf(q) >= 0) s += 150;
      if (entry.node.id.toLowerCase().indexOf(q) >= 0) s += 120;
      if ((entry.node.tags || []).join(' ').toLowerCase().indexOf(q) >= 0) s += 110;
      if (entry.node.type.toLowerCase().indexOf(q) >= 0) s += 60;
      var i = entry.hay.indexOf(q);
      if (i >= 0) s += 40;
      if (s > 0) s += Math.min(20, entry.node.degree || 0);
      return s;
    }

    function run(q) {
      q = q.trim().toLowerCase();
      items = [];
      if (!q) { render(); return; }

      var hits = [];
      index.forEach(function (e) { var s = score(e, q); if (s > 0) hits.push({ e: e, s: s }); });
      hits.sort(function (a, b) { return b.s - a.s; });
      hits.slice(0, 14).forEach(function (h) {
        items.push({ kind: 'node', id: h.e.node.id, label: h.e.label, sub: subOf(h.e), q: q, node: h.e.node });
      });

      // 板块也当作一种结果
      view.graph.regions.forEach(function (r) {
        if (!r.stat) return;
        if ((r.name + ' ' + (r.en || '')).toLowerCase().indexOf(q) >= 0) {
          items.push({ kind: 'region', id: r.id, label: r.name, sub: r.stat.count + ' 个节点', q: q });
        }
      });

      active = items.length ? 0 : -1;
      render();
    }

    function subOf(e) {
      var st = e.st || U.plain(e.title);
      return U.truncate(st || MG.typeStyle(e.node.type).name, 64);
    }

    function mark(text, q) {
      if (!q) return U.escapeHtml(text);
      var i = text.toLowerCase().indexOf(q);
      if (i < 0) return U.escapeHtml(text);
      return U.escapeHtml(text.slice(0, i)) + '<mark>' +
        U.escapeHtml(text.slice(i, i + q.length)) + '</mark>' +
        U.escapeHtml(text.slice(i + q.length));
    }

    function render() {
      if (!items.length) {
        var v = input.value.trim();
        results.innerHTML = v
          ? '<div class="sr-empty">没有找到「' + U.escapeHtml(v) + '」相关的节点</div>'
          : '';
        open = !!v;
      } else {
        results.innerHTML = items.map(function (it, i) {
          var color = it.kind === 'region'
            ? (view.graph.regionById[it.id] || {}).color || '#ccc'
            : MG.typeStyle(it.node.type).color;
          var tagText = it.kind === 'region' ? '板块' : MG.typeStyle(it.node.type).name;
          var regionName = '';
          if (it.kind === 'node' && it.node.regions.length) {
            var r0 = view.graph.regionById[it.node.regions[0]];
            if (r0) regionName = r0.name;
          }
          return '<div class="sr-item' + (i === active ? ' active' : '') + '" data-i="' + i + '">' +
            '<span class="sr-dot" style="background:' + color + '"></span>' +
            '<span class="sr-title">' + mark(it.label, it.q) + '</span>' +
            '<span class="sr-sub">' + U.escapeHtml(tagText) + ' · ' + U.escapeHtml(it.sub) + '</span>' +
            (regionName ? '<span class="sr-region">' + U.escapeHtml(regionName) + '</span>' : '<span class="sr-region">' + U.escapeHtml(tagText) + '</span>') +
            '</div>';
        }).join('');
        open = true;
      }
      results.classList.toggle('hidden', !open);
      box.classList.toggle('active', open);
    }

    function choose(i) {
      var it = items[i];
      if (!it) return;
      if (it.kind === 'region') hooks.onRegion && hooks.onRegion(it.id);
      else hooks.onNode && hooks.onNode(it.id);
      close();
    }

    function close() {
      open = false;
      active = -1;
      results.classList.add('hidden');
      box.classList.remove('active');
    }

    function clear() {
      input.value = '';
      items = [];
      close();
    }

    /* ---------------------------------------------------------- 事件 */
    input.addEventListener('input', function () { run(input.value); });
    input.addEventListener('focus', function () {
      box.classList.add('active');
      if (input.value.trim()) run(input.value);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!items.length) return;
        e.preventDefault();
        active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        open = true;
        render();
        var el = results.querySelector('.sr-item.active');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        choose(active < 0 ? 0 : active);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        if (input.value) clear(); else { close(); input.blur(); }
      }
    });
    input.addEventListener('blur', function () { setTimeout(close, 140); });

    results.addEventListener('mousedown', function (e) {
      var el = e.target.closest ? e.target.closest('.sr-item') : null;
      if (!el) return;
      e.preventDefault();
      choose(parseInt(el.getAttribute('data-i'), 10));
    });

    document.addEventListener('mousedown', function (e) {
      if (!box.contains(e.target)) close();
    });

    return {
      reindex: reindex,
      clear: clear,
      close: close,
      focus: function () { input.focus(); input.select(); }
    };
  }

  MG.createSearch = createSearch;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 详情面板
   --------------------------------------------------------------------------
   点节点 → 显示类型 / 板块 / 陈述 / 说明 + 相关连线（可点击跳转）
   点连线 → 显示推导过程（推出 / 等价 / 定义引用）
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;
  var T = MG.theme;
  var GU = MG.graphUtil;

  function createPanel(panelEl, bodyEl, closeBtn, view, hooks) {
    var current = null;

    function hide() {
      current = null;
      panelEl.classList.add('hidden');
      hooks.onClose && hooks.onClose();
    }

    function show(what) {
      current = what;
      panelEl.classList.remove('hidden');
      panelEl.scrollTop = 0;
      if (what.type === 'node') renderNode(view.graph.byId[what.id]);
      else renderEdge(findEdge(what.id));
    }

    function findEdge(id) {
      for (var i = 0; i < view.graph.edges.length; i++) if (view.graph.edges[i].id === id) return view.graph.edges[i];
      return null;
    }

    /* ------------------------------------------------------------ 零件 */
    function kindBadge(type) {
      var st = MG.typeStyle(type);
      return '<span class="pn-kind" style="background:' + st.color + '">' +
        '<span class="dot"></span>' + U.escapeHtml(st.name) + '</span>';
    }

    function regionChips(node) {
      if (!node.regions.length && !node.clusterObj) return '';
      var head = '';
      if (node.clusterObj) {
        var g = view.graph.galaxyOf ? view.graph.galaxyOf(node.clusterObj) : null;
        var col = node.clusterObj.color || (g ? g.color : '#8892A0');
        head = '<span class="pn-chip" data-cluster="' + node.clusterObj.id + '">' +
          '<span class="lg-swatch" style="background:' + U.mixWithWhite(col, 0.62) + '"></span>' +
          U.escapeHtml(node.clusterObj.name) + '</span>';
      }
      return '<div class="pn-regions">' + head + node.regions.map(function (rid) {
        var r = view.graph.regionById[rid];
        if (!r) return '';
        return '<span class="pn-chip" data-region="' + r.id + '">' +
          '<span class="lg-swatch" style="background:' + r.color + '"></span>' +
          U.escapeHtml(r.name) + '</span>';
      }).join('') + '</div>';
    }

    function nodeRow(n, prefix, keyword) {
      var st = MG.typeStyle(n.type);
      var desc = U.plain(n.statement) || U.plain(n.notes) || U.plain(n.title);
      return '<div class="pn-link" data-kind="node" data-id="' + n.id + '">' +
        '<span class="dot" style="background:' + st.color + '"></span>' +
        (keyword ? '<span class="kw">' + U.escapeHtml(keyword) + '</span>' : '') +
        '<span><span class="nm">' + U.escapeHtml(n.label) + '</span>' +
        '<div class="ds">' + U.escapeHtml(U.truncate(desc, 56)) + '</div></span>' +
        '</div>';
    }

    function edgeRow(e, keyword) {
      var name = T.edgeNames[e.kind] || e.kind;
      var arrow = e.kind === 'implication' ? '⟹'
        : e.kind === 'equivalence' ? '⟺'
          : e.kind === 'analogy' ? '～' : '·';
      var head = e.title || shortLabel(e, 40);
      var snippet = '';
      if (e.proof) snippet = U.plain(e.proof);
      else if (e.proofs && e.proofs.length) snippet = e.proofs.map(function (p) { return p.label; }).join(' / ');
      else if (e.note) snippet = U.plain(e.note);
      return '<div class="pn-link" data-kind="edge" data-id="' + e.id + '">' +
        '<span class="dot" style="background:' + edgeDot(e) + '"></span>' +
        (keyword ? '<span class="kw">' + U.escapeHtml(keyword) + '</span>' : '') +
        '<span><span class="nm">' + U.titleHtml(U.truncate(head, 44)) + '</span>' +
        '<div class="ds">' + arrow + ' ' + U.escapeHtml(name) +
        (snippet ? ' · ' + U.escapeHtml(U.truncate(snippet, 48)) : '') + '</div></span>' +
        '</div>';
    }

    function edgeDot(e) {
      if (e.kind === 'definition') return 'rgba(60,112,245,0.75)';
      if (e.kind === 'equivalence') return '#1C1C1E';
      return '#1C1C1E';
    }

    function shortLabel(e, n) {
      var g = view.graph;
      if (e.kind === 'analogy') {
        return U.truncate(lbl(g, e.a) + ' ～ ' + lbl(g, e.b), n);
      }
      if (e.kind === 'equivalence') {
        return U.truncate(lbl(g, e.a) + ' ⟺ ' + lbl(g, e.b), n);
      }
      if (e.kind === 'definition') {
        return U.truncate('「' + lbl(g, e.definition) + '」→ ' + lbl(g, e.usedBy), n);
      }
      var s = e.sources.map(function (id) { return lbl(g, id); }).join(' + ');
      return U.truncate(s + ' ⟹ ' + lbl(g, e.target), n);
    }

    function lbl(g, id) { var n = g.byId[id]; return n ? n.label : id; }

    function section(title, html) {
      return '<div class="pn-sec"><h4>' + U.escapeHtml(title) + '</h4>' + html + '</div>';
    }

    function listOrNone(rows, emptyText) {
      if (!rows.length) return '<div class="pn-none">' + U.escapeHtml(emptyText) + '</div>';
      return '<div class="pn-list">' + rows.join('') + '</div>';
    }

    /* -------------------------------------------------------- 节点面板 */
    function renderNode(n) {
      if (!n) { hide(); return; }
      var g = view.graph;
      var html = '';
      html += kindBadge(n.type);
      html += '<h1 class="pn-h1">' + U.titleHtml(n.title) + '</h1>';
      html += '<div class="pn-h2">' + U.escapeHtml(n.id) + '</div>';
      /* 依赖深度：由连线现算（见 core/layers.js），不写在内容里 */
      if (typeof n.layer === 'number') {
        var pre = [], post = [];
        g.edges.forEach(function (e) {
          if (e.kind === 'implication') {
            if (e.target === n.id) pre.push(e); else if (e.sources.indexOf(n.id) >= 0) post.push(e);
          } else if (e.kind === 'definition') {
            if (e.usedBy === n.id) pre.push(e); else if (e.definition === n.id) post.push(e);
          }
        });
        html += '<div class="pn-h2">第 ' + n.layer + ' 层（依赖深度）· 它依赖 ' + pre.length +
          ' 个 · 被 ' + post.length + ' 个依赖</div>';
      }
      html += regionChips(n);

      if (n.statement) html += section('陈述', '<div class="pn-body">' + U.md(n.statement) + '</div>');
      if (n.notes) html += section('说明 / 备注', '<div class="pn-body">' + U.md(n.notes) + '</div>');
      if (n.refs && n.refs.length) {
        html += section('参考', '<div class="pn-body"><ul>' + n.refs.map(function (r) {
          return '<li>' + U.escapeHtml(r) + '</li>';
        }).join('') + '</ul></div>');
      }

      /* 相关连线 */
      var out = [], inc = [], eqs = [], defs = [], users = [], anas = [];
      (g.edgesOf[n.id] || []).forEach(function (e) {
        if (e.kind === 'implication') {
          if (e.target === n.id) inc.push(edgeRow(e, '被推出'));
          else out.push(edgeRow(e, '推出'));
        } else if (e.kind === 'equivalence') {
          eqs.push(edgeRow(e, '等价'));
        } else if (e.kind === 'analogy') {
          anas.push(edgeRow(e, '类比'));
        } else if (e.kind === 'definition') {
          if (e.usedBy === n.id) {
            var d = g.byId[e.definition];
            if (d) defs.push(nodeRow(d, '定义', ''));
          } else {
            users.push(edgeRow(e, '用于'));
          }
        }
      });

      html += section('由本节点推出的结论（' + out.length + '）',
        listOrNone(out, '暂无'));
      html += section('推出本节点的结论（' + inc.length + '）',
        listOrNone(inc, '暂无（可能是原始公理或定义）'));
      html += section('等价命题（' + eqs.length + '）',
        listOrNone(eqs, '暂无'));
      if (anas.length) {
        html += section('类比 / 思想相通（' + anas.length + '）',
          '<div class="pn-hint">⚠️ 弱边：不是逻辑蕴含，只提供联想线索</div>' +
          listOrNone(anas, '暂无'));
      }
      if (MG.config.highlightDefinitions) {
        html += section('陈述中用到的定义（' + defs.length + '）',
          listOrNone(defs, '暂无'));
        if (users.length) {
          html += section('本定义被以下结论引用（' + users.length + '）',
            listOrNone(users, '暂无'));
        }
      }
      bodyEl.innerHTML = html;
    }

    /* -------------------------------------------------------- 连线面板 */
    function renderEdge(e) {
      if (!e) { hide(); return; }
      var g = view.graph;
      var name = T.edgeNames[e.kind] || e.kind;
      var color = e.kind === 'definition' ? '#3C70F5' : '#1C1C1E';
      var html = '';

      html += '<span class="pn-kind" style="background:' + color + '">' +
        '<span class="dot"></span>' + U.escapeHtml(name) + '</span>';
      html += '<h1 class="pn-h1">' + U.titleHtml(e.title || shortLabel(e, 120)) + '</h1>';
      html += '<div class="pn-h2">' + U.escapeHtml(e.id) + '</div>';

      /* 推导图式 */
      var gph = '';
      if (e.kind === 'implication') {
        gph = e.sources.map(function (id) {
          return '<span class="pn-link" data-kind="node" data-id="' + id + '" style="display:inline-flex;padding:0"><b>' +
            U.escapeHtml(lbl(g, id)) + '</b></span>';
        }).join('<span class="arrow">+</span>') +
          '<span class="arrow">⟹</span>' +
          '<span class="pn-link" data-kind="node" data-id="' + e.target + '" style="display:inline-flex;padding:0"><b>' +
          U.escapeHtml(lbl(g, e.target)) + '</b></span>';
      } else if (e.kind === 'equivalence' || e.kind === 'analogy') {
        gph = '<span class="pn-link" data-kind="node" data-id="' + e.a + '" style="display:inline-flex;padding:0"><b>' +
          U.escapeHtml(lbl(g, e.a)) + '</b></span>' +
          '<span class="arrow">' + (e.kind === 'analogy' ? '～' : '⟺') + '</span>' +
          '<span class="pn-link" data-kind="node" data-id="' + e.b + '" style="display:inline-flex;padding:0"><b>' +
          U.escapeHtml(lbl(g, e.b)) + '</b></span>';
      } else {
        gph = '「<b>' + U.escapeHtml(lbl(g, e.definition)) + '</b>」 出现在 ' +
          '<span class="pn-link" data-kind="node" data-id="' + e.usedBy + '" style="display:inline-flex;padding:0"><b>' +
          U.escapeHtml(lbl(g, e.usedBy)) + '</b></span> 的陈述中';
      }
      html += '<div class="pn-arith">' + gph + '</div>';

      /* 过程：等价线会把「被它遮住的同向箭头」的证明也一并列出来 */
      var steps = [];
      if (e.kind === 'equivalence') {
        (e.proofs || []).forEach(function (p) {
          steps.push({ label: p.label || '', text: p.text || '' });
        });
        if (MG.config.hideParallelImplications) {
          view.graph.edges.forEach(function (o) {
            if (o.kind !== 'implication' || o.sources.length !== 1) return;
            var s = o.sources[0];
            if ((s === e.a && o.target === e.b) || (s === e.b && o.target === e.a)) {
              steps.push({ label: o.title || (lbl(g, s) + ' ⇒ ' + lbl(g, o.target)), text: o.proof || '', tag: '箭头' });
            }
          });
        }
      }

      if (steps.length) {
        html += section('为什么等价', steps.map(function (p, i) {
          return '<div class="pn-step">' +
            '<div class="pn-step-title"><span class="badge">' + (p.tag || (i + 1)) + '</span>' +
            U.titleHtml(p.label || '') + '</div>' +
            '<div class="pn-body">' + U.md(p.text || '') + '</div></div>';
        }).join(''));
      } else if (e.proof) {
        html += section(e.kind === 'implication' ? '推导过程' : '说明', '<div class="pn-body">' + U.md(e.proof) + '</div>');
      } else if (e.kind === 'definition') {
        var d = g.byId[e.definition];
        html += section('说明', '<div class="pn-body">' +
          U.md(e.note || ('该结论的陈述中使用了定义「' + lbl(g, e.definition) + '」。')) + '</div>');
        if (d && d.statement) {
          html += section('定义原文 · ' + d.label, '<div class="pn-body">' + U.md(d.statement) + '</div>');
        }
      }

      if (e.note && e.proofs) {
        html += '<div class="pn-note">' + U.md(e.note) + '</div>';
      } else if (e.note && e.proof) {
        html += '<div class="pn-note">' + U.md(e.note) + '</div>';
      }

      bodyEl.innerHTML = html;
    }

    /* ----------------------------------------------------------- 事件 */
    bodyEl.addEventListener('click', function (ev) {
      var cchip = ev.target.closest ? ev.target.closest('[data-cluster]') : null;
      if (cchip) {
        hooks.onCluster && hooks.onCluster(cchip.getAttribute('data-cluster'));
        return;
      }
      var chip = ev.target.closest ? ev.target.closest('[data-region]') : null;
      if (chip) {
        hooks.onRegion && hooks.onRegion(chip.getAttribute('data-region'));
        return;
      }
      var row = ev.target.closest ? ev.target.closest('[data-kind][data-id]') : null;
      if (!row) return;
      var kind = row.getAttribute('data-kind');
      var id = row.getAttribute('data-id');
      if (kind === 'node') hooks.onGoto && hooks.onGoto({ type: 'node', id: id });
      else hooks.onGoto && hooks.onGoto({ type: 'edge', id: id });
    });

    closeBtn.addEventListener('click', hide);

    return {
      show: show,
      hide: hide,
      get current() { return current; }
    };
  }

  MG.createPanel = createPanel;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 可见性（哪些点参与绘制）
   --------------------------------------------------------------------------
   左下角的「显示节点」面板改的就是这里。规则只有两条：

     · 被隐藏的节点：不画、不出名字、不响应点击
     · 只要有一端被隐藏，这条连线也一起不画（不留半截悬空的线）

   挑选结果记在 localStorage 里 —— 下次打开还是你挑的那一块。
   引擎的其它部分只问两件事：isNodeVisible(id) / edgeOk(edge)。

   注：hidden 用 Object.create(null) 当字典（节点 id 里带点、带冒号，不能用普通对象）
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});

  var KEY = 'mathgalaxy.hidden.v1';

  function createVisibility(graph) {
    var hidden = Object.create(null);       // id → true
    var listeners = [];
    var nodes = graph.nodes;
    var extraFilter = null;                 // 额外的可见条件（例如「只看主干」）

    /* ------------------------------------------------------------ 读写 */
    function read() {
      var raw = null;
      try { raw = global.localStorage ? global.localStorage.getItem(KEY) : null; }
      catch (e) { raw = null; }                       // 无痕模式 / 受限的 file://
      if (!raw) return;
      var list = null;
      try { list = JSON.parse(raw); } catch (e) { return; }
      if (!list || typeof list.forEach !== 'function') return;
      list.forEach(function (id) {
        if (typeof id === 'string' && graph.byId[id]) hidden[id] = true;
      });
    }

    function write() {
      try {
        if (!global.localStorage) return;
        var ids = Object.keys(hidden);
        if (ids.length) global.localStorage.setItem(KEY, JSON.stringify(ids));
        else global.localStorage.removeItem(KEY);
      } catch (e) { /* 记不住就算了，不影响使用 */ }
    }

    /** 每处改动只走一次：存盘 → 通知（面板重画 + 星图重画） */
    function commit() {
      write();
      listeners.forEach(function (cb) {
        try { cb(); } catch (e) { console.error('[数学星图] 可见性回调出错', e); }
      });
    }

    /* ------------------------------------------------------------ 查询 */
    function isNodeVisible(id) {
      if (hidden[id]) return false;
      if (extraFilter && !extraFilter(id)) return false;
      return true;
    }
    function isNodeHidden(id) { return !isNodeVisible(id); }

    function hiddenCount() { return Object.keys(hidden).length; }

    function visibleCount() {
      var c = 0;
      for (var i = 0; i < nodes.length; i++) if (isNodeVisible(nodes[i].id)) c++;
      return c;
    }

    /** 两个端点都还在，这条线才画 */
    function edgeOk(e) {
      var ids = MG.graphUtil.edgeNodes(e);
      for (var i = 0; i < ids.length; i++) if (!isNodeVisible(ids[i])) return false;
      return true;
    }

    /**
     * 换一个「额外条件」（不动用户手动的隐藏集合）。
     * 例如「只看主干」：传一个 (id) => 是否主干 的函数；传 null 取消。
     */
    function setFilter(fn) {
      if (extraFilter === fn) return;
      extraFilter = fn || null;
      commit();
    }
    function hasFilter() { return !!extraFilter; }

    /* ------------------------------------------------------------ 改动 */
    function setNode(id, visible) {
      if (!graph.byId[id]) return;
      if (visible) { if (!hidden[id]) return; delete hidden[id]; }
      else { if (hidden[id]) return; hidden[id] = true; }
      commit();
    }

    /** 一次勾一批（整个星系 / 整个星团），只通知一次 */
    function setMany(ids, visible) {
      var hits = 0;
      ids.forEach(function (id) {
        if (!graph.byId[id]) return;
        if (visible) { if (hidden[id]) { delete hidden[id]; hits++; } }
        else if (!hidden[id]) { hidden[id] = true; hits++; }
      });
      if (hits) commit();
    }

    function showAll() {
      if (!Object.keys(hidden).length) return;
      hidden = Object.create(null);
      commit();
    }

    function hideAll() {
      if (visibleCount() === 0) return;
      nodes.forEach(function (n) { hidden[n.id] = true; });
      commit();
    }

    function invert() {
      var next = Object.create(null);
      nodes.forEach(function (n) { if (!hidden[n.id]) next[n.id] = true; });
      hidden = next;
      commit();
    }

    /** 只看这些：其余全藏起来 */
    function only(ids) {
      var keep = Object.create(null);
      ids.forEach(function (id) { keep[id] = true; });
      var next = Object.create(null);
      nodes.forEach(function (n) { if (!keep[n.id]) next[n.id] = true; });
      hidden = next;
      commit();
    }

    /**
     * 换了一张图（外部内容包加载完会重建 graph）：
     * 保留挑选结果，但丢掉已经不存在的 id。
     */
    function rebind(g) {
      graph = g;
      nodes = g.nodes;
      var dropped = 0;
      Object.keys(hidden).forEach(function (id) {
        if (!g.byId[id]) { delete hidden[id]; dropped++; }
      });
      if (dropped) commit();
    }

    function onChange(cb) {
      listeners.push(cb);
      return function () {
        var i = listeners.indexOf(cb);
        if (i >= 0) listeners.splice(i, 1);
      };
    }

    /** 恢复上次的挑选（初始状态，不触发回调） */
    read();

    return {
      isNodeVisible: isNodeVisible,
      isNodeHidden: isNodeHidden,
      hiddenCount: hiddenCount,
      visibleCount: visibleCount,
      edgeOk: edgeOk,
      setFilter: setFilter,
      hasFilter: hasFilter,
      setNode: setNode,
      setMany: setMany,
      showAll: showAll,
      hideAll: hideAll,
      invert: invert,
      only: only,
      rebind: rebind,
      onChange: onChange,
      hiddenIds: function () { return Object.keys(hidden); }
    };
  }

  MG.createVisibility = createVisibility;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 外部内容包加载器（为「GitHub 多端同步 / PDF 笔记导入」预留）
   --------------------------------------------------------------------------
   页面里写死的 packs（src/data/packs/*.js）是「本地内容」；
   这里负责把「外部内容」也并进来，二者的数据结构完全一样：

     外部目录结构（默认 src/data/external/）：
       external/
         index.json          ← 内容包清单 { "packs": ["my-notes.json", ...] }
         my-notes.json       ← { "name": "…", "nodes": [...], "edges": [...] }

   用 file:// 直接打开网页时浏览器会禁止 fetch，此时静默跳过（不影响使用）；
   想要多端同步 / 导入 PDF 笔记，用本地服务器打开即可：
       python -m http.server 8000      →  http://localhost:8000
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});

  var DEFAULT_BASE = 'src/data/external/';

  function fetchJSON(url) {
    if (typeof fetch !== 'function') return Promise.resolve(null);
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) return null;
      return r.json();
    }).catch(function () { return null; });
  }

  /**
   * 尝试加载外部内容包。
   * @returns {Promise<{packs: Array, base: string, loaded: number}>}
   */
  function loadExternal(base) {
    base = base || DEFAULT_BASE;
    return fetchJSON(base + 'index.json').then(function (manifest) {
      if (!manifest || !manifest.packs || !manifest.packs.length) {
        return { packs: [], base: base, loaded: 0 };
      }
      return Promise.all(manifest.packs.map(function (f) {
        return fetchJSON(base + f).then(function (p) {
          if (!p) return null;
          p.name = p.name || f;
          return p;
        });
      })).then(function (list) {
        var packs = list.filter(Boolean);
        return { packs: packs, base: base, loaded: packs.length };
      });
    }).catch(function () {
      return { packs: [], base: base, loaded: 0 };
    });
  }

  /** 把任意 JSON 对象当作一个内容包校验（供将来的导入功能使用） */
  function validatePack(p) {
    var errs = [];
    if (!p || typeof p !== 'object') return { ok: false, errs: ['不是对象'] };
    if (!Array.isArray(p.nodes)) errs.push('缺少 nodes 数组');
    if (p.edges && !Array.isArray(p.edges)) errs.push('edges 必须是数组');
    (p.nodes || []).forEach(function (n, i) {
      if (!n.id) errs.push('第 ' + i + ' 个节点缺少 id');
      if (!n.label && !n.title) errs.push('节点 ' + n.id + ' 缺少 label/title');
    });
    return { ok: errs.length === 0, errs: errs };
  }

  MG.loader = {
    loadExternal: loadExternal,
    validatePack: validatePack,
    DEFAULT_BASE: DEFAULT_BASE
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

   再到测度、积分、L^p、RN 定理。
   主干上的点必须满足「不看它就接不上后面」——它要么是某个概念的入口，
   要么是整条线绕不过去的那一步。

   ⭐⭐ 按内容准则第 ① 条，主干按**构造顺序**排：新对象必须是**造**出来的，
   不是「满足某组性质的东西」。所以 ℝ 那一段的顺序是
   ℕ 存在 → 归纳原理 → 商集 → ℤ → ℚ → 绝对值 → Cauchy 列 → **ℝ（构造）** →
   **ℝ 是完备有序域（性质，是定理）**，而不是反过来。

   ⚠️ 但主干是**分段**的（一、数系；二、序与选择；三、测度；四、积分；五、函数空间），

   自检：`bun tools/_trunkcheck.mjs`（id 存在性 + 前向依赖分类）。

   括号里的数字是**当前**层号（依赖深度）。层号是运行时算出来的、内容一改就变，
   **以 `bun tools/_layers.mjs` 为准**；`_trunkcheck.mjs --apply` 可以刷新这些数字。

   用法：图例上方的工具条点「主干」→ 只留这些点，其余全藏起来。
