<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>MathGalaxy · Task 3D.2 手机验收</title><style>body{font:16px system-ui;margin:24px;line-height:1.65}a{display:block;padding:14px;margin:12px 0;border:1px solid #aaa;border-radius:8px;text-decoration:none;color:inherit}progress{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><h2>MathGalaxy · Task 3D.2</h2><p>最终桌面验收的两份冻结构建。两版使用相同的语言、初始区域与主题，分别保存本地设置。</p><div id="choices"><a href="?build=before&lang=zh&region=1&theme=light">A · 优化前</a><a href="?build=candidate&lang=zh&region=1&theme=light">B · 最终候选版</a></div><p id="status"></p><progress id="progress" max="25" value="0" hidden></progress><pre id="error"></pre><noscript>请启用 JavaScript。</noscript>
<script>
(async function(){
  const url=new URL(location.href),build=url.searchParams.get('build');
  if(build!=='before'&&build!=='candidate')return;
  const status=document.getElementById('status'),progress=document.getElementById('progress');
  const expected={before:'bd6cfc36f312cfd9a9eaf3699778bcc836d87d782c37e231f2401e612065443d',candidate:'84d460cc86a7b6bdc897ad02a27085152318c41b1ed4f4a33511d4d40a60c4c2'}[build];
  const expectedBytes={before:10821434,candidate:10824049}[build];
  const parts=new Array(25);let done=0;
  try{
    progress.hidden=false;status.textContent='正在下载 '+build+'…';
    for(let i=0;i<25;i+=4){
      await Promise.all(Array.from({length:Math.min(4,25-i)},(_,j)=>i+j).map(async n=>{
        const name=n===1?(build==='candidate'?'01-candidate.txt':'01.txt'):String(n).padStart(2,'0')+'.txt';
        const response=await fetch('d32/parts/'+name);
        if(!response.ok)throw Error(name+' HTTP '+response.status);
        parts[n]=new Uint8Array(await response.arrayBuffer());
        progress.value=++done;status.textContent='已下载 '+done+'/25';
      }));
    }
    const size=parts.reduce((sum,p)=>sum+p.byteLength,0);
    if(size!==expectedBytes)throw Error('构建大小不匹配: '+size);
    const bytes=new Uint8Array(size);let offset=0;
    for(const p of parts){bytes.set(p,offset);offset+=p.length}
    parts.length=0;
    status.textContent='校验 SHA-256…';
    if(!window.crypto||!crypto.subtle)throw Error('当前浏览器无法校验构建，请使用 HTTPS Safari 或 Edge');
    const digest=await crypto.subtle.digest('SHA-256',bytes);
    const hex=Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('');
    if(hex!==expected)throw Error('SHA-256 mismatch: '+hex);
    let html=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
    const ns='mathgalaxy-test-d32-'+build+'.';
    html=html.replace('<head>','<head><meta name="robots" content="noindex,nofollow,noarchive">');
    html=html.replace(/(['"])mathgalaxy\.(theme|read\.lang|geo|canvas\.lang|layout\.v[12]|camera\.v1|hidden\.v1|read\.v1|read\.show\.v1)\1/g,(_,q,key)=>q+ns+key+q);
    if(!url.searchParams.has('lang'))url.searchParams.set('lang','zh');
    history.replaceState(null,'',url.href);
    status.textContent='校验通过，正在启动…';
    document.open();document.write(html);document.close();
  }catch(e){status.textContent='测试页面启动失败';document.getElementById('error').textContent=String(e);}
})();
</script></body></html>
